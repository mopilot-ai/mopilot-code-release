name: Main E2E
# Runs in the public release repository (mopilot-ai/mopilot-code-release, where Actions minutes are free), like
# main-unit-tests.yml beside it; scripts/sync-release-repo.sh copies this file there as
# .github/workflows/main-e2e.yml.
# main-validation.yml runs this suite and the unit suite against one captured SHA, normally every 15 minutes.
# Job `scope` (scripts/main-e2e-scope.mjs) picks what to test: only the specs the commits since main's last green run reach
# (the selection the PR check uses), or the whole suite whenever that cannot be trusted and once a night
# (docs/unit-coverage.md#scoped-e2e-and-the-nightly-full-run). A scoped result says so in its description.
# The E2E shards (one per 30 specs, and shard `own` for the specs that take a runner to themselves: scripts/e2e-own-runner.mjs)
# share the account's five macOS slots with PR checks; a shard beyond them waits in the queue, which the deadline does not count. Jobs have 35-minute deadlines;
# a failed suite can retry once without repeating a successful counterpart, and the retry runs only the shards that
# did not pass (skip_shards), so its success with the first try's passes covers every shard on that SHA.
# This workflow also accepts manual dispatch, which runs every shard.
# Started by hand for one commit: gh workflow run main-e2e.yml -R mopilot-ai/mopilot-code-release -f sha=<sha>
#
# Secret SOURCE_TOKEN: the token pr-unit-tests.yml uses (Contents read, Commit statuses read and write), plus Issues
# read and write for the main-red issue. Run logs
# here are public, as release.yml's are: no test traces are uploaded, and a failure's page snapshot goes to the log.
run-name: ${{ inputs.sha && format('E2E for main at {0}', inputs.sha) || 'E2E for main' }}
on:
  workflow_call:
    inputs:
      sha: { required: true, type: string }
      scope: { required: false, type: string, default: '' }
      # the whole suite, whatever the commits since the last green run reach (the night's run, and the retry of one)
      full: { required: false, type: boolean, default: false }
      # the first try's choice (its `chosen` output): the retry tests the same specs on the same shards, which
      # skip_shards counts by number, however main's statuses have moved since
      first_try: { required: false, type: string, default: '' }
      reuse_success: { required: false, type: boolean, default: true }
      # the paired cycle retries this suite on this SHA if it fails: its failure is left to the retry's report
      retry_follows: { required: false, type: boolean, default: false }
      # matrix exclusions, e.g. [{"shard": 1}], for shards that already passed on this SHA in the calling run
      skip_shards: { required: false, type: string, default: '[]' }
    secrets:
      SOURCE_TOKEN: { required: true }
    # the result the report job posted ('' when none was posted), which the paired cycle's retry follows: a job that
    # never got a runner leaves the suite `abandoned`, a result the caller cannot tell from the others
    outputs:
      state: { value: '${{ jobs.report.outputs.state }}' }
      # 'false' when a fixes-main merge landed after this SHA and the report recorded the failure: the cycle skips its retry
      retry: { value: '${{ jobs.report.outputs.retry }}' }
      chosen: { value: '${{ toJSON(jobs.scope.outputs) }}' }
  workflow_dispatch:
    inputs:
      sha: { description: 'Commit of main to test (default: the newest)', required: false, type: string }
      full: { description: 'Every spec (default); false runs only the specs the commits since the last green run reach', required: false, type: boolean, default: true }
permissions: { contents: read }
concurrency:
  # one run at a time; a newer scheduled run waits instead of cancelling one already testing
  group: main-e2e
  cancel-in-progress: false
env:
  SOURCE_REPO: ${{ vars.SOURCE_REPO }}
  STATUS_CONTEXT: main-e2e

jobs:
  pick:
    if: vars.SOURCE_REPO != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - name: Pick main's commit and mark it pending
        id: pick
        env: { GH_TOKEN: '${{ secrets.SOURCE_TOKEN }}', SHA: '${{ inputs.sha }}', REUSE_SUCCESS: '${{ inputs.reuse_success && !inputs.full }}', FULL: '${{ inputs.full }}' }
        run: |
          set -euo pipefail
          sha=${SHA:-$(gh api "repos/$SOURCE_REPO/git/ref/heads/main" --jq .object.sha)}
          # Status reads accept abbreviated SHAs, but creating a status needs the full commit identity.
          if [ -n "${SHA:-}" ] && ! [[ "$sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            [[ "$sha" =~ ^[0-9a-fA-F]{1,39}$ ]] || { echo "::error::Expected a full or abbreviated commit SHA"; exit 1; }
            short_sha=$sha
            sha=$(gh api "repos/$SOURCE_REPO/commits/$short_sha" --jq .sha) || {
              echo "::error::Could not resolve the abbreviated commit SHA"; exit 1;
            }
            # Check identity as well as shape; keep case matching local to this test (also works on Bash 3).
            if ! [[ "$sha" =~ ^[0-9a-fA-F]{40}$ ]] || ! (shopt -s nocasematch; [[ "$sha" == "$short_sha"* ]]); then
              echo "::error::Could not resolve the abbreviated commit SHA"; exit 1;
            fi
          fi
          # A report/issue failure or a concurrent manual run must not erase a completed successful suite.
          if [ "${REUSE_SUCCESS:-false}" = true ] || [ "${FULL:-}" = true ]; then
            state=$(gh api "repos/$SOURCE_REPO/commits/$sha/statuses?per_page=100" --jq "[.[] | select(.context == \"$STATUS_CONTEXT\")][0].state")
          fi
          if [ "${REUSE_SUCCESS:-false}" = true ] && [ "${state:-}" = success ]; then echo "Keeping completed $STATUS_CONTEXT at $sha"; exit 0; fi
          # A full run on a commit that already passed leaves the pass in place until its own result replaces it: a pending
          # status would make main unverified for the length of the run, and the freshness alert would open every night.
          if [ "${FULL:-}" = true ] && [ "${state:-}" = success ]; then echo "sha=$sha" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Retry only transient HTTP errors/timeouts, never permission failures; no test rerun.
          payload=$(jq -cn --arg state pending --arg context "$STATUS_CONTEXT" --arg description 'Running the end-to-end suite' \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')
          code=$(curl -q --fail --silent --show-error --proto '=https' --max-time 15 --retry 2 --retry-max-time 30 \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            --header 'Content-Type: application/json' --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-raw "$payload" --output /dev/null --write-out '%{http_code}' \
            "$GITHUB_API_URL/repos/$SOURCE_REPO/statuses/$sha")
          [ "$code" = 201 ] || { echo "::error::Commit status returned HTTP $code"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # which specs to test: scripts/main-e2e-scope.mjs. It runs the whole suite on any doubt, and a job that leaves no
  # answer (the checkout is of a commit before the script, npm ci fails) counts as one: its outputs are empty, which
  # the jobs below read as a full run
  scope:
    needs: pick
    if: needs.pick.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    outputs:
      mode: ${{ steps.reuse.outputs.mode || steps.scope.outputs.mode }}
      count: ${{ steps.reuse.outputs.count || steps.scope.outputs.count }}
      shards: ${{ steps.reuse.outputs.shards || steps.scope.outputs.shards }}
      # the shards with `own` (scripts/main-e2e-scope.mjs), which job e2e runs; `shards` stays for the numbered count
      matrix: ${{ steps.reuse.outputs.matrix || steps.scope.outputs.matrix }}
      specs: ${{ steps.reuse.outputs.specs || steps.scope.outputs.specs }}
      suffix: ${{ steps.reuse.outputs.suffix || steps.scope.outputs.suffix }}
    steps:
      # a retry takes its first try's choice as it is; without one (or one that chose nothing) it works the choice out
      - id: reuse
        env: { FIRST_TRY: '${{ inputs.first_try }}', SKIP: '${{ inputs.skip_shards }}' }
        run: |
          set -euo pipefail
          mode=$(printf '%s' "${FIRST_TRY:-}" | jq -r '.mode // empty' 2>/dev/null || true)
          if [ -z "$mode" ] && [ -n "${FIRST_TRY:-}" ] && printf '%s' "${SKIP:-}" | jq -e 'length > 0' > /dev/null 2>&1; then
            # the first try's scope left no answer and some of its shards passed, so it ran job e2e's fallback split: so
            # does the retry, since skip_shards names those shards by number, and a count worked out now would split the
            # suite differently and leave some specs in no shard that passed
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            echo "The first try ran the fallback shards, and so does this retry"
            exit 0
          fi
          [ -n "$mode" ] || exit 0
          for key in mode count shards matrix specs suffix; do
            echo "$key=$(printf '%s' "$FIRST_TRY" | jq -r --arg key "$key" '.[$key] // ""')" >> "$GITHUB_OUTPUT"
          done
          echo "The first try's choice stands: $mode"
      - if: steps.reuse.outputs.mode == '' && steps.reuse.outputs.fallback != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_REPO }}
          ref: ${{ needs.pick.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          # the history, to find the last green run's commit and what changed since
          fetch-depth: 0
          persist-credentials: false
      - if: steps.reuse.outputs.mode == '' && steps.reuse.outputs.fallback != 'true'
        uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      # the selection reads sources with the parser in node_modules, and needs no Electron or install script
      - if: steps.reuse.outputs.mode == '' && steps.reuse.outputs.fallback != 'true'
        run: npm ci --ignore-scripts
      - id: scope
        if: steps.reuse.outputs.mode == '' && steps.reuse.outputs.fallback != 'true'
        env: { GH_TOKEN: '${{ secrets.SOURCE_TOKEN }}', SHA: '${{ needs.pick.outputs.sha }}', FULL: '${{ inputs.full }}' }
        run: node scripts/main-e2e-scope.mjs

  e2e:
    needs: [pick, scope]
    # no spec reached: nothing to run, and the report posts the pass
    if: ${{ !cancelled() && needs.pick.outputs.sha != '' && needs.scope.outputs.mode != 'none' }}
    runs-on: macos-15
    # a full shard runs about 24 minutes, install included (run 40803682381): room for a slower runner or its retry
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # `matrix` from a scope script that knows shard `own`, `shards` from one before it, the whole suite when no answer
        # (shared/mainValidation.ts E2E_SHARDS, with the count below)
        shard: ${{ fromJSON(needs.scope.outputs.matrix || needs.scope.outputs.shards || '[1,2,3,4,5,6,7,8,"own"]') }}
        exclude: ${{ fromJSON(inputs.skip_shards || '[]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_REPO }}
          ref: ${{ needs.pick.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      # Electron's download, kept between runs
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      # Electron downloads its binary on first use; a network blip there would fail the shard's first test
      - run: node scripts/ensure-electron.cjs || { sleep 10; node scripts/ensure-electron.cjs; } || { sleep 30; node scripts/ensure-electron.cjs; }
      # the whole suite or the specs the scope picked, in as many shards as it asked for (strategy.job-total would
      # shrink with the shards a retry skips); shard `own` runs the specs that take a runner to themselves, which the
      # numbered shards leave out (E2E_RUNNER, read by tests/e2e/playwright.config.ts)
      - name: Run the specs
        env:
          MODE: ${{ needs.scope.outputs.mode }}
          SPECS: ${{ needs.scope.outputs.specs }}
          PART: ${{ matrix.shard }}
          SHARD: ${{ matrix.shard }}/${{ needs.scope.outputs.count || 8 }}
        run: |
          set -euo pipefail
          if [ "$PART" = own ]; then
            # a run whose scope left no answer has this shard whether or not a spec needs it, and a commit from before
            # shard `own` has no such spec: its numbered shards ran them all
            [ -f scripts/e2e-own-runner.mjs ] || { echo "No spec takes a runner to itself at this commit"; exit 0; }
            export E2E_RUNNER=own; part=(--pass-with-no-tests)
          else
            export E2E_RUNNER=shards; part=(--shard="$SHARD")
          fi
          if [ "$MODE" = scoped ]; then
            for spec in $SPECS; do
              [[ "$spec" =~ ^tests/e2e/[A-Za-z0-9._-]+\.spec\.ts$ ]] || { echo "::error::Not an E2E spec: $spec"; exit 1; }
            done
            # word splitting of SPECS is the point: one argument per spec path, each checked above
            npx playwright test -c tests/e2e "${part[@]}" $SPECS
          else
            npm run test:e2e -- "${part[@]}"
          fi
      # what the page held when a test failed, so a failure only the runner shows can be read from the log
      - if: failure()
        run: |
          for f in test-results/e2e/*/error-context.md; do
            [ -f "$f" ] || continue
            echo "::group::$f"; cat "$f"; echo "::endgroup::"
          done

  # The failure that stands (no retry follows): each failing spec not quarantined yet runs alone at this commit, and one
  # that fails alone runs alone at main's last full green commit too, so the report can tell a flake or an old break
  # from a merge's (scripts/e2e-quarantine.mjs, docs/unit-coverage.md#flake-quarantine). Neither job decides anything,
  # and the plan runs on Linux, so a failure with nothing to isolate holds none of the five macOS runners.
  isolate-plan:
    needs: [pick, scope, e2e]
    if: ${{ !cancelled() && needs.pick.outputs.sha != '' && needs.e2e.result != 'success' && needs.e2e.result != 'skipped' && !inputs.retry_follows }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions: { contents: read, actions: read }
    outputs:
      specs: ${{ steps.plan.outputs.specs }}
      green: ${{ steps.plan.outputs.green }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_REPO }}
          ref: ${{ needs.pick.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - id: plan
        env: { GH_TOKEN: '${{ github.token }}', SOURCE_TOKEN: '${{ secrets.SOURCE_TOKEN }}', SCOPE: '${{ inputs.scope }}', SHA: '${{ needs.pick.outputs.sha }}' }
        run: |
          set -euo pipefail
          node scripts/e2e-quarantine.mjs logs "$RUNNER_TEMP/failed.log"
          GH_TOKEN=$SOURCE_TOKEN node scripts/e2e-quarantine.mjs plan "$RUNNER_TEMP/failed.log"

  isolate:
    needs: [pick, isolate-plan]
    if: ${{ !cancelled() && needs.isolate-plan.outputs.specs != '' }}
    runs-on: macos-15
    timeout-minutes: 35
    continue-on-error: true
    outputs:
      verdicts: ${{ steps.verdicts.outputs.verdicts }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_REPO }}
          ref: ${{ needs.pick.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Run each failing spec alone
        env: { SPECS: '${{ needs.isolate-plan.outputs.specs }}' }
        run: |
          set -euo pipefail
          npm ci
          node scripts/ensure-electron.cjs || { sleep 10; node scripts/ensure-electron.cjs; }
          : > "$RUNNER_TEMP/alone.txt"
          for spec in $SPECS; do
            [[ "$spec" =~ ^tests/e2e/[A-Za-z0-9._-]+\.spec\.ts$ ]] || { echo "::error::Not an E2E spec: $spec"; exit 1; }
            if npx playwright test -c tests/e2e --retries=0 "$spec"; then echo "pass $spec"; else echo "fail $spec"; fi >> "$RUNNER_TEMP/alone.txt"
          done
          cat "$RUNNER_TEMP/alone.txt"
      - if: needs.isolate-plan.outputs.green != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_REPO }}
          ref: ${{ needs.isolate-plan.outputs.green }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: green
          persist-credentials: false
      - name: Run each spec that failed alone at the last green commit
        if: needs.isolate-plan.outputs.green != ''
        working-directory: green
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/green.txt"
          failed=$(sed -n 's/^fail //p' "$RUNNER_TEMP/alone.txt")
          [ -n "$failed" ] || exit 0
          npm ci
          node scripts/ensure-electron.cjs || { sleep 10; node scripts/ensure-electron.cjs; }
          for spec in $failed; do
            # a spec added since green is no older break: it is left out, and so counts as caused
            [ -f "$spec" ] || continue
            if npx playwright test -c tests/e2e --retries=0 "$spec"; then echo "pass $spec"; else echo "fail $spec"; fi >> "$RUNNER_TEMP/green.txt"
          done
          cat "$RUNNER_TEMP/green.txt"
      # whatever ran: a spec with no result counts as caused
      - id: verdicts
        if: always()
        env: { SPECS: '${{ needs.isolate-plan.outputs.specs }}' }
        run: node scripts/e2e-quarantine.mjs verdicts "$RUNNER_TEMP/alone.txt" "$RUNNER_TEMP/green.txt"

  report:
    needs: [pick, scope, e2e, isolate-plan, isolate]
    if: ${{ !cancelled() && needs.pick.outputs.sha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # actions: read for the failed jobs' logs, which name the failing tests
    permissions: { contents: read, actions: read }
    outputs:
      state: ${{ steps.post.outputs.state }}
      retry: ${{ steps.issue.outputs.retry }}
    steps:
      # main's history at the tested commit: the triage and the issue read the likely cause from it. A step here that
      # fails leaves the shards' own result to be posted (continue-on-error), never a pending status.
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ${{ vars.SOURCE_REPO }}
          ref: ${{ needs.pick.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      # the Node the scripts are written for, not whichever the runner image ships
      - uses: actions/setup-node@v4
        continue-on-error: true
        with: { node-version: 24 }
      # the failed jobs' logs, which name the failing tests; an empty file is a log that could not be read
      - name: Read the failed jobs' logs
        if: needs.e2e.result != 'success'
        continue-on-error: true
        env: { GH_TOKEN: '${{ github.token }}', SCOPE: '${{ inputs.scope }}' }
        run: node scripts/e2e-quarantine.mjs logs "$RUNNER_TEMP/failed.log"
      # a failure only in quarantined specs, or one isolation found a flake or an old break, posts the pass
      - name: Triage the failure against the quarantine
        id: triage
        if: needs.e2e.result != 'success' && needs.e2e.result != 'skipped'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          SHA: ${{ needs.pick.outputs.sha }}
          RETRY_FOLLOWS: ${{ inputs.retry_follows }}
          VERDICTS: ${{ needs.isolate.outputs.verdicts }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/e2e-quarantine.mjs triage "$RUNNER_TEMP/failed.log"
      - name: Post the result on main's commit
        id: post
        env:
          GH_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          SHA: ${{ needs.pick.outputs.sha }}
          RESULT: ${{ steps.triage.outputs.result || needs.e2e.result }}
          MODE: ${{ needs.scope.outputs.mode }}
          SUFFIX: ${{ needs.scope.outputs.suffix }}${{ steps.triage.outputs.suffix }}
        run: |
          set -euo pipefail
          # no spec reached: the shards were skipped, which is a pass
          if [ "${MODE:-}" = none ] && [ "$RESULT" = skipped ]; then RESULT=success; fi
          # a scoped result says so ("(scoped: …)"): only a full pass vouches for the specs it did not run
          if [ "$RESULT" = success ]; then state=success; description="The end-to-end suite passed${SUFFIX:-}"
          else state=failure; description="The end-to-end suite failed${SUFFIX:-}; see the failing shards"; fi
          # Retry only transient HTTP errors/timeouts, never permission failures; no test rerun.
          payload=$(jq -cn --arg state "$state" --arg context "$STATUS_CONTEXT" --arg description "$description" \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')
          code=$(curl -q --fail --silent --show-error --proto '=https' --max-time 15 --retry 2 --retry-max-time 30 \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            --header 'Content-Type: application/json' --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-raw "$payload" --output /dev/null --write-out '%{http_code}' \
            "$GITHUB_API_URL/repos/$SOURCE_REPO/statuses/$SHA")
          [ "$code" = 201 ] || { echo "::error::Commit status returned HTTP $code"; exit 1; }
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "main at $SHA: $state"
      # one open issue per red run on main (label main-red), closed when it passes (scripts/main-red-issue.mjs); needs
      # SOURCE_TOKEN to have Issues read and write. A failure here leaves the status above in place. It names the likely
      # cause from main's history and the import graph of this checkout (docs/unit-coverage.md#fix-forward); it pushes
      # nothing and opens no pull request.
      - name: Open, update or close the main-red issue
        id: issue
        env:
          GH_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          RETRY_FOLLOWS: ${{ inputs.retry_follows }}
          SHA: ${{ needs.pick.outputs.sha }}
          STATE: ${{ steps.post.outputs.state }}
        run: |
          set -euo pipefail
          # the logs step wrote what it could read; an empty file is an unreadable log, which the issue says
          [ -f "$RUNNER_TEMP/failed.log" ] || : > "$RUNNER_TEMP/failed.log"
          state=${STATE:-failure}
          node scripts/main-red-issue.mjs main-e2e "$SHA" "$state" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$RUNNER_TEMP/failed.log"
