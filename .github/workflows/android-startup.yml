name: Android startup
# Runs in the public release repository (mopilot-ai/mopilot-code-release, where Actions minutes are free); scripts/sync-release-repo.sh
# copies this file there as .github/workflows/android-startup.yml. By hand only: it builds the phone app's release APK for x86_64 at two
# commits of the source repository, installs each on an Android emulator (API 36, google_apis, x86_64, hardware-accelerated by the Linux
# runner's KVM) and measures three cold starts of each (`am start -W`, then how long the Welcome screen takes to draw), keeping the ANR
# reports, so a startup regression between two commits shows without a developer's Mac. Full commit ids (the logs here are public and a
# branch name would name private work):
#   gh workflow run android-startup.yml -R mopilot-ai/mopilot-code-release -f sha=<commit to check> -f base_sha=<an older commit to compare>
# Secret SOURCE_TOKEN: the token pr-unit-tests.yml uses (Contents read is all this workflow needs). Run logs and artifacts here are
# public: the APK is never uploaded, and the artifact holds only crash, ANR and launch lines of the app (a narrow logcat filter that leaves
# out the JavaScript's own output), the ANR reports of the app process and the timings; it is kept one day. The build's own output (Metro,
# Gradle) and the checkout's last-commit line are in the public log as in mobile-release-checks.yml, so measure commits whose merge
# subjects you are content to show. The two commits run on two runners: a difference of a few hundred milliseconds is noise, a hang or
# an ANR on one side and not the other is the finding.
# With `-f what=journey` it instead builds the phone app against the dev host (scripts/mobile-dev-host.mjs, started on the runner) and drives
# the signed-in journey on the emulator (scripts/android-journey.mjs): sign in, pair, open a chat, answer its approval card, use the terminal,
# read the changes, press back, and cold start again. One commit, one runner; the summary has a verdict per step and the artifact the screen
# where a step failed (the dev host's data is made up; its log, which holds a pairing code, is not uploaded):
#   gh workflow run android-startup.yml -R mopilot-ai/mopilot-code-release -f what=journey -f sha=<commit to check>
run-name: ${{ inputs.what == 'journey' && format('Android journey {0}', inputs.sha) || format('Android startup {0} vs {1}', inputs.sha, inputs.base_sha) }}
on:
  workflow_dispatch:
    inputs:
      what: { description: 'startup: measure cold starts of two commits; journey: drive the signed-in journey on one', required: true, type: choice, options: [startup, journey], default: startup }
      sha: { description: 'Full commit id of the source repository to measure', required: true, type: string }
      base_sha: { description: 'startup only: full commit id to compare it with', required: false, type: string }
permissions: { contents: read }

jobs:
  startup:
    if: vars.SOURCE_REPO != '' && inputs.what == 'startup'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        which: [new, base]
    steps:
      - name: Check the inputs
        env: { SHA: '${{ inputs.sha }}', BASE: '${{ inputs.base_sha }}' }
        run: |
          set -euo pipefail
          for id in "$SHA" "$BASE"; do [[ "$id" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Expected full commit ids"; exit 1; }; done
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_REPO }}
          ref: ${{ matrix.which == 'new' && inputs.sha || inputs.base_sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install the phone app's dependencies
        run: npm ci --prefix mobile
      - name: Android SDK pieces React Native builds with, and the emulator image
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          # the pins React Native reads (node_modules/react-native/gradle/libs.versions.toml), so a bump needs no edit here
          toml=mobile/node_modules/react-native/gradle/libs.versions.toml
          pin() { sed -n "s/^$1 = \"\(.*\)\"/\1/p" "$toml"; }
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          # the platform itself is fetched by Gradle (its package name is android-37.0 for 37 but android-36 for 36)
          # a download that arrives damaged ("Error on ZipFile unknown archive") fails the whole install: clear the partial files and try again
          installed=0
          for attempt in 1 2 3; do
            if "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "emulator" "build-tools;$(pin buildTools)" "ndk;$(pin ndkVersion)" \
              "cmake;3.22.1" "system-images;android-36;google_apis;x86_64" > /dev/null; then installed=1; break; fi
            echo "::warning::sdkmanager failed (attempt $attempt of 3)"; rm -rf "$SDK/.temp"; sleep 15
          done
          [ "$installed" = 1 ] || { echo "::error::The Android SDK pieces could not be installed"; exit 1; }
          df -h / | tail -1
      - name: Build the release APK (x86_64 only)
        working-directory: mobile
        run: |
          set -euo pipefail
          npx expo prebuild --platform android --no-install --clean
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          (cd android && ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 -Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=1g' --console=plain --no-daemon)
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/app.apk"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot the emulator
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          # avdmanager writes under $XDG_CONFIG_HOME/.android on the runner but the emulator looks in $ANDROID_AVD_HOME or ~/.android/avd
          # ("Unknown AVD name [startup]"): name one place for both
          export ANDROID_AVD_HOME="$HOME/.android/avd"; mkdir -p "$ANDROID_AVD_HOME"
          # no -d: the runner's cmdline-tools know no `pixel_8` ("No device found matching --device pixel_8"), and the default phone profile is enough
          echo no | avdmanager create avd -n startup -k "system-images;android-36;google_apis;x86_64" --force
          # 4 GB as the Mac recipe (scripts/mobile-android-emulator.sh) found enough, and 3 of the runner's 4 cores so adb keeps one
          # ask avdmanager where it put the AVD rather than assuming
          config="$(avdmanager list avd | sed -n 's/^ *Path: //p' | head -1)/config.ini"
          test -f "$config" || { echo "::error::No AVD config at $config"; avdmanager list avd; exit 1; }
          sed -i '/^hw.ramSize/d; /^hw.cpu.ncore/d' "$config"
          printf 'hw.ramSize=4096\nhw.cpu.ncore=3\n' >> "$config"
          grep -E '^hw.(ramSize|cpu.ncore)' "$config"
          nohup emulator -avd startup -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on > "$RUNNER_TEMP/emulator.log" 2>&1 &
          fail() { echo "::error::$1"; tail -40 "$RUNNER_TEMP/emulator.log"; exit 1; }
          timeout 120 adb wait-for-device || fail "No emulator appeared (is KVM on?)"
          timeout 600 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do sleep 5; done' || fail "The emulator did not finish booting"
          timeout 120 bash -c 'until adb shell pm path android > /dev/null 2>&1; do sleep 2; done' || fail "The package manager never came up"
          for scale in window_animation_scale transition_animation_scale animator_duration_scale; do adb shell settings put global "$scale" 0; done
          adb install -r "$RUNNER_TEMP/app.apk"
      - name: Measure three cold starts
        timeout-minutes: 25
        env: { WHICH: '${{ matrix.which }}', SHA: '${{ matrix.which == ''new'' && inputs.sha || inputs.base_sha }}' }
        run: |
          set -uo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          out="$RUNNER_TEMP/startup-$WHICH"; mkdir -p "$out"
          adb root > /dev/null; adb wait-for-device; sleep 2
          bad=0
          echo 'run,verdict,TotalTime_ms,Welcome_drawn_s,alive,ANRs,crashes' > "$out/timings.csv"
          for i in 1 2 3; do
            adb shell am force-stop ai.mopilot.remote; adb shell 'rm -rf /data/anr/*' ; adb logcat -c
            start=$(adb shell am start -W -n ai.mopilot.remote/.MainActivity)
            status=$(printf '%s' "$start" | sed -n 's/^Status: //p' | tr -d '\r')
            total=$(printf '%s' "$start" | sed -n 's/^TotalTime: //p' | tr -d '\r')
            # one tap after launch: an app whose main thread is stuck leaves it undelivered, and Android then raises the input ANR a
            # healthy start never does (without input there is no ANR to see even when the main thread hangs)
            sleep 3; adb shell input tap 540 1200
            # the Welcome screen's button draws once the JavaScript has run and rendered: seconds until the dump of the app's own window
            # holds it, up to 90 by the clock (a dump takes seconds under software rendering)
            drawn=none; t0=$(date +%s)
            while [ $(( $(date +%s) - t0 )) -lt 90 ]; do
              adb shell rm -f /sdcard/ui.xml
              adb shell uiautomator dump /sdcard/ui.xml > /dev/null 2>&1
              if adb shell grep -q 'text=\"Sign in\"' /sdcard/ui.xml 2>/dev/null && adb shell grep -q 'package=\"ai.mopilot.remote\"' /sdcard/ui.xml 2>/dev/null; then drawn=$(( $(date +%s) - t0 )); break; fi
              sleep 2
            done
            alive=$(adb shell pidof ai.mopilot.remote | wc -w)
            adb logcat -d > "$RUNNER_TEMP/logcat-$i.txt"
            anr=$(grep -c "ANR in ai.mopilot.remote" "$RUNNER_TEMP/logcat-$i.txt" || true)
            crashes=$(grep -c "FATAL EXCEPTION" "$RUNNER_TEMP/logcat-$i.txt" || true)
            # crash, ANR and launch lines of the app only; the JavaScript's own output (console.*, error messages, stack frames) is left out
            grep -E 'FATAL EXCEPTION|AndroidRuntime.*(Exception|Error)|ANR in ai\.mopilot\.remote|Process ai\.mopilot\.remote .*(died|crash)|(Displayed|START).*ai\.mopilot\.remote|SoLoader.*(couldn.t find|UnsatisfiedLink)|Killing .*ai\.mopilot\.remote' "$RUNNER_TEMP/logcat-$i.txt" | cut -c1-240 | head -100 > "$out/startup-$i.txt" || true
            rm -f "$RUNNER_TEMP/logcat-$i.txt"
            mkdir -p "$out/anr-$i"; adb pull /data/anr "$out/anr-$i" > /dev/null 2>&1 || true
            find "$out/anr-$i" -type f -size +512k -delete
            if [ "$crashes" != 0 ]; then verdict=crash
            elif [ "$anr" != 0 ]; then verdict=anr
            elif [ "$alive" = 0 ]; then verdict=died
            elif [ "$drawn" = none ] || [ "$status" != ok ]; then verdict=hang
            else verdict=ok; fi
            [ "$verdict" = ok ] || bad=1
            printf '%s,%s,%s,%s,%s,%s,%s\n' "$i" "$verdict" "${total:-none}" "$drawn" "$alive" "$anr" "$crashes" >> "$out/timings.csv"
            echo "run $i: $verdict: am start -W Status=${status:-none} TotalTime=${total:-none} ms, Welcome drawn after ${drawn}s, process alive=$alive, ANRs=$anr, crashes=$crashes"
          done
          {
            echo "### $WHICH ($SHA)"
            echo '| run | verdict | TotalTime ms | Welcome drawn (s) | alive | ANRs | crashes |'
            echo '| --- | --- | --- | --- | --- | --- | --- |'
            tail -n +2 "$out/timings.csv" | sed 's/,/ | /g; s/^/| /; s/$/ |/'
            echo
            echo 'Two runners: a few hundred milliseconds between the two commits is noise; a hang, ANR or crash on one only is the finding.'
          } >> "$GITHUB_STEP_SUMMARY"
          # a run that did not start cleanly fails the job (the artifact below is uploaded anyway)
          [ "$bad" = 0 ] || { echo "::error::At least one of the three starts of the $WHICH commit did not start cleanly"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-startup-${{ matrix.which }}
          path: ${{ runner.temp }}/startup-${{ matrix.which }}
          retention-days: 1
          if-no-files-found: warn

  journey:
    if: vars.SOURCE_REPO != '' && inputs.what == 'journey'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check the input
        env: { SHA: '${{ inputs.sha }}' }
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Expected a full commit id"; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_REPO }}
          ref: ${{ inputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install the phone app's and the dev host's dependencies
        # --ignore-scripts: the dev host needs the packages, not Electron's download or node-pty's build (its terminals then run on pipes)
        run: |
          npm ci --prefix mobile
          npm ci --ignore-scripts
          # the install's prepare step makes this file, and the dev host will not start without it
          node scripts/harness-catalog.mjs
      - name: Android SDK pieces React Native builds with, and the emulator image
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          toml=mobile/node_modules/react-native/gradle/libs.versions.toml
          pin() { sed -n "s/^$1 = \"\(.*\)\"/\1/p" "$toml"; }
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          # a download that arrives damaged ("Error on ZipFile unknown archive") fails the whole install: clear the partial files and try again
          installed=0
          for attempt in 1 2 3; do
            if "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "emulator" "build-tools;$(pin buildTools)" "ndk;$(pin ndkVersion)" \
              "cmake;3.22.1" "system-images;android-36;google_apis;x86_64" > /dev/null; then installed=1; break; fi
            echo "::warning::sdkmanager failed (attempt $attempt of 3)"; rm -rf "$SDK/.temp"; sleep 15
          done
          [ "$installed" = 1 ] || { echo "::error::The Android SDK pieces could not be installed"; exit 1; }
      - name: Build the release APK for the dev host (x86_64 only)
        working-directory: mobile
        # The emulator reaches the runner's loopback as 10.0.2.2. A release build blocks plain http, which the dev host speaks, so the
        # generated manifest allows it for this build only. A release build ignores the dev host unless MOPILOT_DEV_CLIENT=1 is set too
        # (mobile/README.md); Release has no dev launcher, so the app starts on its embedded bundle.
        env: { MOPILOT_DEV_HOST: 'http://10.0.2.2:8787', MOPILOT_DEV_CLIENT: '1' }
        run: |
          set -euo pipefail
          npx expo prebuild --platform android --no-install --clean
          manifest=android/app/src/main/AndroidManifest.xml
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /' "$manifest"
          [ "$(grep -c 'usesCleartextTraffic' "$manifest")" = 1 ] || { echo "::error::The manifest has no single usesCleartextTraffic"; exit 1; }
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          (cd android && ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 -Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=1g' --console=plain --no-daemon)
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/app.apk"
          # the baked config must carry the dev host, or the app signs in at mopilot.ai (the run would then fail at sign-in)
          unzip -p "$RUNNER_TEMP/app.apk" assets/app.config | grep -q devClient || echo "::warning::The APK's app.config shows no devClient; the app may talk to production"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot the emulator and install the app
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          export ANDROID_AVD_HOME="$HOME/.android/avd"; mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n journey -k "system-images;android-36;google_apis;x86_64" --force
          config="$(avdmanager list avd | sed -n 's/^ *Path: //p' | head -1)/config.ini"
          test -f "$config" || { echo "::error::No AVD config at $config"; avdmanager list avd; exit 1; }
          sed -i '/^hw.ramSize/d; /^hw.cpu.ncore/d' "$config"
          printf 'hw.ramSize=4096\nhw.cpu.ncore=3\n' >> "$config"
          nohup emulator -avd journey -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on > "$RUNNER_TEMP/emulator.log" 2>&1 &
          fail() { echo "::error::$1"; tail -40 "$RUNNER_TEMP/emulator.log"; exit 1; }
          timeout 120 adb wait-for-device || fail "No emulator appeared (is KVM on?)"
          timeout 600 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do sleep 5; done' || fail "The emulator did not finish booting"
          timeout 120 bash -c 'until adb shell pm path android > /dev/null 2>&1; do sleep 2; done' || fail "The package manager never came up"
          for scale in window_animation_scale transition_animation_scale animator_duration_scale; do adb shell settings put global "$scale" 0; done
          # the sign-in opens a browser tab: Chrome's first-run screens are switched off so the tab goes straight to the dev host's page
          adb root > /dev/null; adb wait-for-device
          # adbd restarts as root: wait until a shell is root before using it
          timeout 60 bash -c 'until [ "$(adb shell id -u 2>/dev/null | tr -d "\r")" = 0 ]; do sleep 1; done' || fail "adb never came back as root"
          adb shell 'echo "chrome --disable-fre --no-default-browser-check --no-first-run" > /data/local/tmp/chrome-command-line; chmod 755 /data/local/tmp/chrome-command-line'
          adb shell am set-debug-app --persistent com.android.chrome || true
          adb install -r "$RUNNER_TEMP/app.apk"
      - name: Drive the journey
        timeout-minutes: 30
        # SHELL: the dev host's terminals run it; without node-pty they run on pipes
        env: { SHA: '${{ inputs.sha }}', SHELL: /bin/bash }
        run: |
          set +e -uo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          host="$RUNNER_TEMP/host"; out="$RUNNER_TEMP/journey"; mkdir -p "$host" "$out"
          # the dev host reads its commands from stdin and stops when it closes: a FIFO held open here keeps it running
          mkfifo "$RUNNER_TEMP/host.in"; exec 3<>"$RUNNER_TEMP/host.in"
          node scripts/mobile-dev-host.mjs --loopback --host 10.0.2.2 --renew --dir "$host" < "$RUNNER_TEMP/host.in" > "$RUNNER_TEMP/host.log" 2>&1 &
          host_pid=$!
          echo "dev host pid $host_pid"
          if ! timeout 180 bash -c "until [ -s '$host/pairing-code.txt' ]; do kill -0 $host_pid 2>/dev/null || exit 1; sleep 2; done"; then
            echo "::error::The dev host did not come up"; grep -E '^(  (relay|account|scratch|paired)|Error|.*ERR_|Cannot)' "$RUNNER_TEMP/host.log" | cut -c1-120 | tail -30; exit 1
          fi
          adb logcat -c
          node scripts/android-journey.mjs --out "$out" --code-file "$host/pairing-code.txt"; code=$?
          # only the process started above is stopped
          kill "$host_pid" 2>/dev/null; exec 3>&-
          # crash, ANR and launch lines of the app only; the JavaScript's own output is left out
          adb logcat -d | grep -E 'FATAL EXCEPTION|AndroidRuntime.*(Exception|Error)|ANR in ai\.mopilot\.remote|Process ai\.mopilot\.remote .*(died|crash)|Killing .*ai\.mopilot\.remote' | cut -c1-240 | head -100 > "$out/app-crashes.txt" || true
          { echo "### Signed-in journey ($SHA)"; cat "$out/journey.md"; } >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-journey
          path: ${{ runner.temp }}/journey
          retention-days: 1
          if-no-files-found: warn
