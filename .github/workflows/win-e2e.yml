name: Windows E2E
# Runs in the public release repository (mopilot-ai/mopilot-code-release, where Actions minutes are free), like
# main-e2e.yml beside it; scripts/sync-release-repo.sh copies this file there as .github/workflows/win-e2e.yml.
# Runs the E2E specs that need no Mac (the Linux shards' selection, E2E_RUNNER=windows in scripts/e2e-own-runner.mjs) on
# windows-latest, from a checkout of one source commit, in as many shards as asked for; `specs` runs only those files.
# Informational: job `report` summarises the shards and posts no commit status, so the run gates no merge and no release
# (docs/unit-coverage.md#windows-e2e). A runner is nobody's desktop (scripts/release-suites.cjs).
# Started by hand:
#   gh workflow run win-e2e.yml -R mopilot-ai/mopilot-code-release -f sha=<full source commit> [-f shards=8] [-f specs='tests/e2e/a.spec.ts …']
# The commit can be any one, a branch's too, so its jobs only read the Actions caches; they save the Electron download and
# the Rust core's build only for a commit in main's history, as main's own runs would (docs/unit-coverage.md#cache-writes).
# Secret SOURCE_TOKEN: the token pr-unit-tests.yml uses (Contents read is all this workflow needs). Run logs here are
# public: no test traces are uploaded, and a failure's page snapshot goes to the log.
run-name: ${{ format('Windows E2E at {0}', inputs.sha) }}
on:
  workflow_dispatch:
    inputs:
      sha: { description: 'Full commit id of the source repository to test', required: true, type: string }
      shards: { description: 'How many shards to split the specs into (1 to 20)', required: false, type: string, default: '8' }
      specs: { description: 'Space-separated tests/e2e/*.spec.ts to run instead of every spec that needs no Mac', required: false, type: string, default: '' }
permissions: { contents: read }
env:
  SOURCE_REPO: ${{ vars.SOURCE_REPO }}

jobs:
  plan:
    if: vars.SOURCE_REPO != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.inputs.outputs.matrix }}
      on_main: ${{ steps.main.outputs.on_main }}
    steps:
      - name: Check the inputs
        id: inputs
        env: { SHA: '${{ inputs.sha }}', SHARDS: '${{ inputs.shards }}', SPECS: '${{ inputs.specs }}' }
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Expected a full commit id"; exit 1; }
          [[ "$SHARDS" =~ ^[1-9][0-9]?$ ]] && [ "$SHARDS" -le 20 ] || { echo "::error::Expected 1 to 20 shards"; exit 1; }
          for spec in $SPECS; do
            [[ "$spec" =~ ^tests/e2e/[A-Za-z0-9._-]+\.spec\.ts$ ]] || { echo "::error::Not an E2E spec: $spec"; exit 1; }
          done
          echo "matrix=$(jq -cn --argjson n "$SHARDS" '[range(1; $n + 1)]')" >> "$GITHUB_OUTPUT"
      # whether the commit is in main's history (main is behind or at it): only then may the shards save a cache, which
      # later runs on any commit restore. Anything else, an unreadable answer too, only reads.
      - name: Check whether the commit is on main
        id: main
        env: { GH_TOKEN: '${{ secrets.SOURCE_TOKEN }}', SHA: '${{ inputs.sha }}' }
        run: |
          set -uo pipefail
          status=$(gh api "repos/$SOURCE_REPO/compare/main...$SHA" --jq .status 2>/dev/null || true)
          if [ "$status" = behind ] || [ "$status" = identical ]; then on_main=true; else on_main=false; fi
          echo "on_main=$on_main" >> "$GITHUB_OUTPUT"
          echo "$SHA against main: ${status:-unknown}; saves caches: $on_main"

  e2e:
    needs: plan
    runs-on: windows-latest
    # a cache miss builds the Rust core before the first spec, about as long again as a Linux shard's install
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # Git's bash, which the steps below are written for, as main-e2e's are
    defaults:
      run:
        shell: bash
    env:
      # npm runs package scripts with cmd.exe on Windows, and this repository's are written for a POSIX shell (`|| true`)
      NPM_CONFIG_SCRIPT_SHELL: 'C:\Program Files\Git\bin\bash.exe'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_REPO }}
          ref: ${{ inputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      # no npm cache: setup-node would save it after the commit's code ran
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      # Electron's download, where @electron/get keeps it on Windows
      - id: electron
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # The Rust core's addon and the sage-mcp.exe beside it, which tests/e2e/global-setup.ts builds on a miss
      # (scripts/build-core.mjs ensureCore), where electron/platform/core.cjs and the tool socket look in a checkout
      - id: core
        uses: actions/cache/restore@v4
        with:
          path: |
            core/target/release/mopilot_core.dll
            core/target/release/sage-mcp.exe
            core/target/release/core-sources.sha256
          key: core-addon-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('core/Cargo.lock', 'core/Cargo.toml', 'core/rust-toolchain.toml', 'core/crates/**') }}
      - run: npm ci
      # Electron downloads its binary on first use; a network blip there would fail the shard's first test
      - run: node scripts/ensure-electron.cjs || { sleep 10; node scripts/ensure-electron.cjs; } || { sleep 30; node scripts/ensure-electron.cjs; }
      # every spec that needs no Mac, or the ones asked for (the runner filter still leaves out those that need a Mac),
      # in this shard's share (E2E_RUNNER, read by tests/e2e/playwright.config.ts)
      - name: Run the specs
        env:
          SHARD: ${{ matrix.shard }}/${{ inputs.shards }}
          SPECS: ${{ inputs.specs }}
        run: |
          set -euo pipefail
          export E2E_RUNNER=windows
          for spec in $SPECS; do
            [[ "$spec" =~ ^tests/e2e/[A-Za-z0-9._-]+\.spec\.ts$ ]] || { echo "::error::Not an E2E spec: $spec"; exit 1; }
          done
          if [ -n "$SPECS" ]; then
            # word splitting of SPECS is the point: one argument per spec path, each checked above; a shard may get none
            npx playwright test -c tests/e2e --shard="$SHARD" --pass-with-no-tests $SPECS
          else
            npx playwright test -c tests/e2e --shard="$SHARD"
          fi
      # what the page held when a test failed, so a failure only the runner shows can be read from the log
      - if: failure()
        run: |
          for f in test-results/e2e/*/error-context.md; do
            [ -f "$f" ] || continue
            echo "::group::$f"; cat "$f"; echo "::endgroup::"
          done
      # main's code only (job plan): the caches a later run on any commit restores
      - if: ${{ !cancelled() && needs.plan.outputs.on_main == 'true' && steps.core.outputs.cache-hit != 'true' && hashFiles('core/target/release/core-sources.sha256') != '' }}
        uses: actions/cache/save@v4
        with:
          path: |
            core/target/release/mopilot_core.dll
            core/target/release/sage-mcp.exe
            core/target/release/core-sources.sha256
          key: ${{ steps.core.outputs.cache-primary-key }}
      - if: ${{ !cancelled() && needs.plan.outputs.on_main == 'true' && steps.electron.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
          key: ${{ steps.electron.outputs.cache-primary-key }}

  # the shards' results and the tests they failed, on the run's summary page; no commit status, no issue
  report:
    needs: [plan, e2e]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # actions: read for the shards' results and logs
    permissions: { contents: read, actions: read }
    steps:
      - name: Summarise the shards
        env: { GH_TOKEN: '${{ github.token }}', SHA: '${{ inputs.sha }}', RESULT: '${{ needs.e2e.result }}' }
        run: |
          set -euo pipefail
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '[.jobs[] | select(.name | startswith("e2e"))]')
          {
            echo "## Windows E2E at $SHA"
            echo
            echo "Informational: this run posts no commit status."
            echo
            echo "| Shard | Result |"
            echo "| --- | --- |"
            printf '%s' "$jobs" | jq -r '.[] | "| \(.name) | \(.conclusion // "unfinished") |"'
          } >> "$GITHUB_STEP_SUMMARY"
          # Playwright's `✘` line for each failing test, from each failed shard's log
          for id in $(printf '%s' "$jobs" | jq -r '.[] | select(.conclusion == "failure") | .id'); do
            name=$(printf '%s' "$jobs" | jq -r --argjson id "$id" '.[] | select(.id == $id) | .name')
            failed=$(curl -fsSL --max-time 60 --header "Authorization: Bearer $GH_TOKEN" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/jobs/$id/logs" | sed -E 's/^[0-9T:.-]+Z //' | grep '✘' | sort -u || true)
            { echo; echo "### $name"; echo; echo '```'; echo "${failed:-(its log names no failing test)}"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "$name"; echo "${failed:-(its log names no failing test)}"
          done
          echo "Windows E2E at $SHA: $RESULT"
          # the run's own result follows the shards', so its page says whether they passed
          [ "$RESULT" = success ] || { echo "::error::The Windows E2E shards did not all pass ($RESULT)"; exit 1; }
