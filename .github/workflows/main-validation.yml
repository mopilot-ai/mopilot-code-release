name: Main validation
# One immutable main SHA per cycle; finish healthy work and select the newest main only when the next cycle starts.
run-name: ${{ inputs.sha && format('Validate main at {0}', inputs.sha) || 'Validate newest main' }}
on:
  workflow_dispatch:
    inputs:
      sha: { description: 'Optional main commit; otherwise select newest main when execution starts', required: false, type: string }
      # the night's full E2E run on a verified main (the sweep asks for it); a cycle's pick job also does it when it is due
      full: { description: 'Run the whole E2E suite, not only the specs the new commits reach', required: false, type: boolean, default: false }
  schedule:
    - cron: '*/15 * * * *'
    # 09:23 UTC, 02:23 in Los Angeles; GitHub rarely fires schedules here, so the sweep starts the run when it is due too
    - cron: '23 9 * * *'
permissions: { contents: read, actions: read }
concurrency:
  group: main-validation
  cancel-in-progress: false
env:
  SOURCE_REPO: ${{ vars.SOURCE_REPO }}

jobs:
  pick:
    if: vars.SOURCE_REPO != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      control: ${{ steps.control.outputs.sha }}
      unit: ${{ steps.pick.outputs.unit }}
      e2e: ${{ steps.pick.outputs.e2e }}
      full: ${{ steps.pick.outputs.full }}
      retryUnit: ${{ steps.pick.outputs.retryUnit }}
      retryE2e: ${{ steps.pick.outputs.retryE2e }}
    steps:
      - uses: actions/checkout@v4
        with: { repository: '${{ vars.SOURCE_REPO }}', ref: main, token: '${{ secrets.SOURCE_TOKEN }}', persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - id: control
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # RELEASE_GH_TOKEN reads this repository's pull request checks: a scheduled cycle yields to their waiting macOS jobs
      - id: pick
        env: { GH_TOKEN: '${{ secrets.SOURCE_TOKEN }}', RELEASE_GH_TOKEN: '${{ github.token }}', SHA: '${{ inputs.sha }}', FULL: '${{ inputs.full }}' }
        run: node scripts/main-validation-cycle.mjs pick

  # retry_follows: a failure here is left to the retry's report, so a flake opens no main-red issue
  unit:
    needs: pick
    if: needs.pick.outputs.unit == 'true'
    uses: ./.github/workflows/main-unit-tests.yml
    with: { sha: '${{ needs.pick.outputs.sha }}', scope: 'unit', reuse_success: true, retry_follows: "${{ needs.pick.outputs.retryUnit == 'true' }}" }
    secrets: inherit

  e2e:
    needs: pick
    if: needs.pick.outputs.e2e == 'true'
    # a full run must not keep a scoped success already on this commit (reuse_success)
    uses: ./.github/workflows/main-e2e.yml
    with: { sha: '${{ needs.pick.outputs.sha }}', scope: 'e2e', full: "${{ needs.pick.outputs.full == 'true' }}", reuse_success: "${{ needs.pick.outputs.full != 'true' }}", retry_follows: "${{ needs.pick.outputs.retryE2e == 'true' }}" }
    secrets: inherit

  # Retry unless the first try posted success (its `state` output): a job that never got a runner leaves the suite
  # `abandoned`, neither failure nor cancelled, and a report that never posted leaves no result at all. Not when its
  # report said retry=false: a fixes-main merge landed after this SHA, and the next cycle tests the fix at once.
  unit-retry:
    needs: [pick, unit]
    if: ${{ !cancelled() && needs.pick.outputs.retryUnit == 'true' && needs.unit.outputs.state != 'success' && needs.unit.outputs.retry != 'false' }}
    uses: ./.github/workflows/main-unit-tests.yml
    with: { sha: '${{ needs.pick.outputs.sha }}', scope: 'unit-retry', reuse_success: true }
    secrets: inherit

  # The shards that passed on the first try are not run again; if this job fails, the retry runs every shard.
  e2e-shards:
    needs: [pick, e2e]
    if: ${{ !cancelled() && needs.pick.outputs.retryE2e == 'true' && needs.e2e.outputs.state != 'success' && needs.e2e.outputs.retry != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.shards.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with: { repository: '${{ vars.SOURCE_REPO }}', ref: '${{ needs.pick.outputs.control }}', token: '${{ secrets.SOURCE_TOKEN }}', persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - id: shards
        env: { GH_TOKEN: '${{ github.token }}' }
        run: node scripts/main-e2e-retry-shards.mjs

  e2e-retry:
    needs: [pick, e2e, e2e-shards]
    if: ${{ !cancelled() && needs.pick.outputs.retryE2e == 'true' && needs.e2e.outputs.state != 'success' && needs.e2e.outputs.retry != 'false' }}
    uses: ./.github/workflows/main-e2e.yml
    with: { sha: '${{ needs.pick.outputs.sha }}', scope: 'e2e-retry', full: "${{ needs.pick.outputs.full == 'true' }}", first_try: '${{ needs.e2e.outputs.chosen }}', reuse_success: true, skip_shards: '${{ needs.e2e-shards.outputs.skip }}' }
    secrets: inherit

  finish:
    needs: [pick, unit, e2e, unit-retry, e2e-retry]
    if: ${{ !cancelled() && needs.pick.outputs.sha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { repository: '${{ vars.SOURCE_REPO }}', ref: '${{ needs.pick.outputs.control }}', token: '${{ secrets.SOURCE_TOKEN }}', persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - env: { GH_TOKEN: '${{ secrets.SOURCE_TOKEN }}', SHA: '${{ needs.pick.outputs.sha }}' }
        run: node scripts/main-validation-cycle.mjs finish
