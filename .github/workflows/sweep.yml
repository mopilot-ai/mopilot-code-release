name: Sweep
# Runs in the public release repository (mopilot-ai/mopilot-code-release), like pr-unit-tests.yml beside it;
# scripts/sync-release-repo.sh copies this file there as .github/workflows/sweep.yml.
# Whenever a pull request check, a run on main or a watcher run finishes, and when the watcher (watch.yml) sees a pull
# request head with no check or an untested main, it runs scripts/ci-sweep.mjs from a checkout of main: it
# starts the unit-tests check for open pull requests whose head has none (an unlabeled one once quiet, wantsCheck), merges pull requests labeled
# `merge-on-green` that the merge gate allows, re-runs a red run's failing tests on a newer main commit (main-reverify.yml),
# starts one paired main validation (at most every 15 minutes, at once while a red result sits behind main's head),
# recovers stalled owners, reports freshness, and starts the watcher when none is queued or running. GitHub's schedule
# events are best effort and were rarely fired here, so finishing runs and the watcher drive it; the schedule below is
# only a backup, and starting it by hand runs one sweep.
#
# Then it copies main's workflows here (scripts/sync-release-repo.sh, which writes only the files that differ): a
# workflow merged on main does nothing here until copied, and a release refuses a release.yml other than the one it
# builds. 0.3.33 failed that way after merge-on-green merged a release.yml change nobody then copied.
#
# Secret SOURCE_TOKEN: the token the other workflows use (Contents read and write, Commit statuses read and write,
# Pull requests read and write for the automatic revert of a red main, Issues read and write). github.token starts the other workflows here.
# Secret WORKFLOW_SYNC_TOKEN: a fine-grained token with Contents and Workflows read and write on this repository only,
# for the copy (github.token cannot change workflows). Without it the sweep warns instead of copying.
run-name: ${{ github.event_name == 'workflow_run' && format('Sweep after {0}', github.event.workflow_run.name) || 'Sweep' }}
on:
  workflow_run:
    workflows: ['PR unit tests', 'Main validation', 'Main unit tests', 'Main E2E', 'Main reverify', 'Watch', 'Release']
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
permissions: { contents: read, actions: write }
concurrency:
  # one sweep at a time; finishing runs that pile up while it works share the one waiting after it
  group: sweep
  cancel-in-progress: false
env:
  SOURCE_REPO: ${{ vars.SOURCE_REPO }}

jobs:
  sweep:
    if: vars.SOURCE_REPO != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_SYNC_TOKEN: ${{ secrets.WORKFLOW_SYNC_TOKEN != '' }}
    steps:
      # main's code, never a pull request's, with the token the merge gate's fetch needs
      - uses: actions/checkout@v4
        with: { repository: '${{ vars.SOURCE_REPO }}', ref: main, token: '${{ secrets.SOURCE_TOKEN }}', fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      # What the previous sweep decided for held pull requests (scripts/merge-snapshot.mjs): merge-on-green skips the gate's
      # reads for one whose inputs have not changed since. It comes from the artifact of the newest finished run of this
      # workflow (scripts/sweep-state.mjs), never an Actions cache entry, which a pull request's check on this branch could
      # write. None restored makes this sweep a full one.
      - name: Restore the previous sweep's state
        env: { GH_TOKEN: '${{ github.token }}', RELEASE_REPO: '${{ github.repository }}' }
        run: node scripts/sweep-state.mjs "$RUNNER_TEMP/sweep-state"
      - name: Start missing checks, merge on green, start the runs on main when due, keep a watcher running
        env:
          { GH_TOKEN: '${{ secrets.SOURCE_TOKEN }}', RELEASE_GH_TOKEN: '${{ github.token }}', RELEASE_REPO: '${{ github.repository }}', SWEEP_STATE: '${{ runner.temp }}/sweep-state/state.json', CHECK_SETTLE_MINUTES: '${{ vars.CHECK_SETTLE_MINUTES }}', CHECK_INFLIGHT: '${{ vars.CHECK_INFLIGHT }}', CHECK_STARVED_MINUTES: '${{ vars.CHECK_STARVED_MINUTES }}' }
        # its output also goes to the log the issue below quotes
        run: |
          set -o pipefail
          mkdir -p "$(dirname "$SWEEP_STATE")"
          node scripts/ci-sweep.mjs 2>&1 | tee -a "$RUNNER_TEMP/sweep.log"
      # for the next sweep, even after a failed step; one sweep runs at a time (concurrency above)
      - name: Keep this sweep's state for the next one
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with: { name: sweep-state, path: '${{ runner.temp }}/sweep-state/state.json', retention-days: 1, if-no-files-found: ignore }
      # after the merges above, and even when a step of the sweep failed; main as it is now, fetched again by the script
      - name: Copy main's workflows here
        if: ${{ !cancelled() && env.HAS_SYNC_TOKEN == 'true' }}
        env: { GH_TOKEN: '${{ secrets.WORKFLOW_SYNC_TOKEN }}', RELEASE_REPO: '${{ github.repository }}' }
        run: |
          set -o pipefail
          bash scripts/sync-release-repo.sh origin/main 2>&1 | tee -a "$RUNNER_TEMP/sweep.log"
      - if: ${{ !cancelled() && env.HAS_SYNC_TOKEN != 'true' }}
        run: echo "::warning::Set the secret WORKFLOW_SYNC_TOKEN so the sweep copies main's workflows here; until then run scripts/sync-release-repo.sh after merging a workflow change."
      # After workflow sync, so the selected verified commit must match the workflow that will actually build it.
      # The sweep's single owner serializes dispatch reservations; Release finishing wakes it to pick up newer main.
      - name: Release verified main to dogfood
        env:
          GH_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          RELEASE_GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          DOGFOOD_RELEASES: ${{ vars.DOGFOOD_RELEASES }}
          DOGFOOD_MIN_INTERVAL_MINUTES: ${{ vars.DOGFOOD_MIN_INTERVAL_MINUTES }}
        run: |
          set -o pipefail
          node scripts/dogfood-release.mjs 2>&1 | tee -a "$RUNNER_TEMP/sweep.log"
      # A sweep posts no commit status, so a failing one is reported here: two failed sweeps in a row open the main-red
      # issue "Main is red: sweep", and the next sweep that passes closes it (scripts/sweep-red-issue.mjs). A sweep that
      # crashed on a missing package stopped every check and merge for 7.5 hours while main read green. Like the sweep,
      # it runs with no installed packages (tests/ciDependencies.test.ts). Needs SOURCE_TOKEN to have Issues read and write.
      - name: Open, update or close the sweep's main-red issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          RELEASE_GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          STATE: ${{ job.status }}
        run: node scripts/sweep-red-issue.mjs "$STATE" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$RUNNER_TEMP/sweep.log"
