name: Linux desktop validation
# Runs in the public release repository on isolated native runners. Only encrypted packages and evidence leave the runner.
# scripts/sync-release-repo.sh installs this manual workflow after the source change merges; it never publishes a release.
run-name: Linux desktop fc28-5fef7e14b3-1793642747393
on:
  push:
    branches: ['linux-validation/fc28-5fef7e14b3-1793642747393']
permissions: { contents: read }
env:
  SOURCE_REPO: ${{ vars.SOURCE_REPO }}
jobs:
  desktop:
    if: vars.SOURCE_REPO != ''
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - name: Validate the source commit and encryption key
        id: validate
        env: { SHA: '5fef7e14b39c2aa645d0e1324c316ee2185eedbe', PUBLIC_KEY: '' }
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Expected a full source commit id'; exit 1; }
          printf '%s' "$PUBLIC_KEY" | base64 --decode > "$RUNNER_TEMP/evidence-public.der"
          openssl rsa -pubin -inform DER -in "$RUNNER_TEMP/evidence-public.der" -noout
          mkdir -p "$RUNNER_TEMP/linux-evidence"
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_REPO }}
          ref: 5fef7e14b39c2aa645d0e1324c316ee2185eedbe
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Install build and desktop dependencies
        run: |
          sudo apt-get update > "$RUNNER_TEMP/linux-evidence/apt.log" 2>&1
          sudo apt-get install -y build-essential python3 libgtk-3-0 libnss3 libxss1 libasound2t64 libsecret-1-0 gnome-keyring dbus-x11 xvfb iproute2 >> "$RUNNER_TEMP/linux-evidence/apt.log" 2>&1
      - name: Install application dependencies
        run: npm ci > "$RUNNER_TEMP/linux-evidence/npm.log" 2>&1
      - name: Install the pinned Rust toolchain
        working-directory: core
        run: rustup toolchain install > "$RUNNER_TEMP/linux-evidence/rust.log" 2>&1
      - name: Build the Linux packages
        run: npm run package:linux > "$RUNNER_TEMP/linux-evidence/build.log" 2>&1
      - name: Install and exercise the packaged desktop
        env: { XDG_CURRENT_DESKTOP: GNOME }
        run: |
          set -euo pipefail
          {
            sudo apt-get install -y ./out/MoPilot-Code-*-$(node -p process.arch).deb
            dbus-run-session -- bash -euo pipefail -c '
              mapfile -t installed < <(dpkg-query -L mopilot-code | sed -n "/^\/opt\/.*\/mopilot-code$/p")
              [ "${#installed[@]}" -eq 1 ]
              printf "%s" "mopilot-ci" | gnome-keyring-daemon --unlock --components=secrets
              xvfb-run -a node scripts/smoke-launch.mjs "$(dirname "${installed[0]}")"
              xvfb-run -a node tests/packaged/linux-desktop.mjs "${installed[0]}"
            '
          } > "$RUNNER_TEMP/linux-evidence/desktop.log" 2>&1
      - name: Encrypt packages and validation evidence
        if: ${{ always() && !cancelled() && steps.validate.outcome == 'success' }}
        env: { PUBLIC_KEY: '' }
        run: |
          set -euo pipefail
          parts=("$RUNNER_TEMP/linux-evidence")
          for p in test-results/linux-package out/*.deb out/*.tar.gz; do [ ! -e "$p" ] || parts+=("$p"); done
          tar -czf "$RUNNER_TEMP/linux-evidence.tgz" "${parts[@]}"
          mkdir -p "$RUNNER_TEMP/linux-encrypted"
          node --input-type=module - <<'JS'
          import * as c from 'node:crypto';
          import fs from 'node:fs';
          const dir = process.env.RUNNER_TEMP;
          const pub = c.createPublicKey({ key: Buffer.from(process.env.PUBLIC_KEY, 'base64'), format: 'der', type: 'spki' });
          const key = c.randomBytes(32), iv = c.randomBytes(12), aes = c.createCipheriv('aes-256-gcm', key, iv);
          const body = Buffer.concat([aes.update(fs.readFileSync(`${dir}/linux-evidence.tgz`)), aes.final()]);
          const sealed = c.publicEncrypt({ key: pub, padding: c.constants.RSA_PKCS1_OAEP_PADDING, oaepHash: 'sha256' }, key);
          fs.writeFileSync(`${dir}/linux-encrypted/key.enc`, sealed);
          fs.writeFileSync(`${dir}/linux-encrypted/bundle.enc`, Buffer.concat([iv, aes.getAuthTag(), body]));
          JS
      - uses: actions/upload-artifact@v4
        if: ${{ always() && !cancelled() && steps.validate.outcome == 'success' }}
        with:
          name: linux-validation-${{ matrix.arch }}
          path: ${{ runner.temp }}/linux-encrypted
          retention-days: 1
          if-no-files-found: error
