name: PR unit tests
# Runs in the public release repository (mopilot-ai/mopilot-code-release, where Actions minutes are free), not in
# the private source repository named by variable SOURCE_REPO. scripts/sync-release-repo.sh copies this file
# there as .github/workflows/pr-unit-tests.yml. It lives outside .github/workflows here so the source
# repository never schedules it.
# For a pull request against main it runs the checks the pre-commit hook runs (scripts/precommit.mjs: Biome's
# format and lint errors, both TypeScript configs and the source header comments, plus the web app's types), so a commit
# made where the hook did not run is still checked; then the lint ratchet (npm run lint:ratchet --
# --base=<main>; docs/bug-prevention/README.md) and the unit tests that reach the change, with changed-line coverage enforced
# (npm run test:coverage -- --changed=<main> --related; docs/unit-coverage.md), on the pull request's head commit
# merged with main as it is when the run starts, and posts the result on the head commit as the commit status
# `unit-tests`, naming that main commit ("merged with main <sha>"). The module map is generated and not committed; a
# branch from before that still holds it, and the merge drops it (scripts/merge-generated.mjs), so a conflict only there
# does not fail the check; any other conflict does. A change without source or test files passes without running tests. Merges go through the merge gate (scripts/merge-gate.mjs).
# Job `plan` finds the related tests and splits them (scripts/test-shards.mjs): the free plan here runs five macOS jobs
# at once and about twenty Linux ones, so job `static` runs the static checks, job `unit` runs the tests on up to four
# Linux shards, job `mac` runs only the related tests that need a real Mac (scripts/mac-only-tests.mjs), and when more
# than one job tested, job `coverage` merges their raw coverage into one report and checks the changed lines
# (docs/unit-coverage.md#runners). A change one Linux shard can test checks its coverage in that shard. Job `plan` also
# picks the fake-based E2E specs the change can break (scripts/e2e-select.mjs), and job `e2e` runs them on up to three
# macOS runners (docs/unit-coverage.md#e2e-specs); the status counts them too.
# Started per pull request (gh workflow run pr-unit-tests.yml -R mopilot-ai/mopilot-code-release -f pr=<n>). When it
# finishes, sweep.yml runs: it starts this check for open pull requests whose head has none and merges pull requests
# labeled `merge-on-green` that the merge gate allows, so an agent asked to merge does not have to poll.
#
# Secret SOURCE_TOKEN: a fine-grained token owned by the source repository's organization, on that
# repository, with Contents read and write (release.yml pushes tags), Commit statuses read and write and
# Pull requests read. Run logs here are public, as release.yml's are: they show pull request numbers, commit
# ids and test output, never pull request titles or bodies. Pull request code runs only after the token has
# been used, with no credentials left in the checkout.
run-name: ${{ format('Unit tests for pull request {0}', inputs.pr) }}
on:
  workflow_dispatch:
    inputs:
      pr: { description: 'Pull request number in the source repository', required: true, type: number }
permissions: { contents: read }
concurrency:
  # a newer run for the same pull request supersedes an older one
  group: pr-unit-tests-${{ inputs.pr }}
  cancel-in-progress: true
env:
  SOURCE_REPO: ${{ vars.SOURCE_REPO }}
  STATUS_CONTEXT: unit-tests
jobs:
  # the pull request's head and main as they are now, which every other job tests, and how the related tests split
  plan:
    if: vars.SOURCE_REPO != ''
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      shards: ${{ steps.split.outputs.shards }}
      mac: ${{ steps.split.outputs.mac }}
      split: ${{ steps.split.outputs.split }}
      digest: ${{ steps.split.outputs.digest }}
      e2e_specs: ${{ steps.e2e.outputs.e2e_specs }}
      e2e_shards: ${{ steps.e2e.outputs.e2e_shards }}
    steps:
      - name: Find the pull request's head and mark it pending
        id: pr
        env: { GH_TOKEN: '${{ secrets.SOURCE_TOKEN }}', PR: '${{ inputs.pr }}' }
        run: |
          set -euo pipefail
          # a variable, not a process substitution, so a failed lookup stops the job (set -e)
          # main is the default branch, not the pull request's base: one stacked on another branch is still tested
          # (and its status named) against main, which the merge gate reads (#1766)
          info=$(gh api "repos/$SOURCE_REPO/pulls/$PR" --jq '"\(.head.sha) \(.base.repo.default_branch) \(.state)"')
          read -r sha base state <<< "$info"
          [ "$state" = open ] || { echo "::error::Pull request $PR is $state."; exit 1; }
          # main as it is now: the pull request is tested merged with it, and the status names it
          base_sha=$(gh api "repos/$SOURCE_REPO/git/ref/heads/$base" --jq .object.sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          # Retry only transient HTTP errors/timeouts, never permission failures; no test rerun.
          payload=$(jq -cn --arg state pending --arg context "$STATUS_CONTEXT" --arg description 'Running the unit tests that reach this change' \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')
          code=$(curl -q --fail --silent --show-error --proto '=https' --max-time 15 --retry 2 --retry-max-time 30 \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            --header 'Content-Type: application/json' --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-raw "$payload" --output /dev/null --write-out '%{http_code}' \
            "$GITHUB_API_URL/repos/$SOURCE_REPO/statuses/$sha")
          [ "$code" = 201 ] || { echo "::error::Commit status returned HTTP $code"; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_REPO }}
          ref: ${{ steps.pr.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          # the whole history, so the change is measured from its merge base with the target branch
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: '**/package-lock.json' }
      - name: Merge main into the pull request
        env:
          BASE_SHA: '${{ steps.pr.outputs.base_sha }}'
          GIT_AUTHOR_NAME: pr-unit-tests
          GIT_AUTHOR_EMAIL: pr-unit-tests@invalid
          GIT_COMMITTER_NAME: pr-unit-tests
          GIT_COMMITTER_EMAIL: pr-unit-tests@invalid
        run: |
          set -euo pipefail
          git show "$BASE_SHA:scripts/merge-generated.mjs" > "$RUNNER_TEMP/merge-generated.mjs"
          node "$RUNNER_TEMP/merge-generated.mjs" "$BASE_SHA"
      # the related-test search needs no Electron or install script, only the modules it reads with
      - run: npm ci --ignore-scripts
      - id: split
        run: node scripts/test-shards.mjs plan --changed=${{ steps.pr.outputs.base_sha }}
      # the fake-based E2E specs the change can break (docs/unit-coverage.md#e2e-specs), for job `e2e`
      - id: e2e
        run: node scripts/e2e-select.mjs --changed=${{ steps.pr.outputs.base_sha }}

  static:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_REPO }}
          ref: ${{ needs.plan.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          # the whole history, so the change is measured from its merge base with the target branch
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: '**/package-lock.json' }
      # the pre-commit hook's header check: every source file has a one-line header comment (it needs only Node)
      - run: npm run module-map -- --check
      # what merging would produce. main's scripts/merge-generated.mjs merges (the pull request may predate it) and
      # drops the generated files main no longer commits (docs/module-map.md), so a conflict only there is none, as
      # merge-on-green's result has it. Any other conflict fails the check (merge main into the branch and push)
      - name: Merge main into the pull request
        env:
          BASE_SHA: '${{ needs.plan.outputs.base_sha }}'
          GIT_AUTHOR_NAME: pr-unit-tests
          GIT_AUTHOR_EMAIL: pr-unit-tests@invalid
          GIT_COMMITTER_NAME: pr-unit-tests
          GIT_COMMITTER_EMAIL: pr-unit-tests@invalid
        run: |
          set -euo pipefail
          git show "$BASE_SHA:scripts/merge-generated.mjs" > "$RUNNER_TEMP/merge-generated.mjs"
          node "$RUNNER_TEMP/merge-generated.mjs" "$BASE_SHA"
      # Electron's download, kept between runs
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm ci
        working-directory: web
      # the pre-commit hook's checks (scripts/precommit.mjs; tests/prUnitTestsWorkflow.test.ts keeps the two in step)
      - run: npx biome check --diagnostic-level=error .
      - run: npm run typecheck
      - run: npm run typecheck
        working-directory: web
      # no bug-class lint warning added, and no rule's total in lint/baseline.json raised (docs/bug-prevention/README.md);
      # a pull request branched before the ratchet existed has nothing to run
      - run: if [ -f scripts/lint-ratchet.mjs ]; then npm run lint:ratchet -- --base=${{ needs.plan.outputs.base_sha }}; fi
      # Same staged-content policy as pre-commit, applied to the merged tree against current main; no extra job.
      - run: node scripts/file-size.mjs --base=${{ needs.plan.outputs.base_sha }}

  # the related tests that run anywhere, round-robin across the planned Linux shards
  unit:
    needs: plan
    if: needs.plan.outputs.shards != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_REPO }}
          ref: ${{ needs.plan.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          # the whole history, so the change is measured from its merge base with the target branch
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: '**/package-lock.json' }
      - name: Merge main into the pull request
        env:
          BASE_SHA: '${{ needs.plan.outputs.base_sha }}'
          GIT_AUTHOR_NAME: pr-unit-tests
          GIT_AUTHOR_EMAIL: pr-unit-tests@invalid
          GIT_COMMITTER_NAME: pr-unit-tests
          GIT_COMMITTER_EMAIL: pr-unit-tests@invalid
        run: |
          set -euo pipefail
          git show "$BASE_SHA:scripts/merge-generated.mjs" > "$RUNNER_TEMP/merge-generated.mjs"
          node "$RUNNER_TEMP/merge-generated.mjs" "$BASE_SHA"
      # Electron's download, kept between runs
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm ci
        working-directory: web
      # this shard's part of the plan (refused when this checkout finds other tests); with one shard and no Mac, the job
      # also checks the change's coverage, as `npm run test:coverage -- --changed=<main> --related` does; otherwise it
      # packs the raw coverage for job `coverage`
      - env:
          MODE: ${{ needs.plan.outputs.split == 'true' && '--raw-out coverage/raw' || format('--changed={0}', needs.plan.outputs.base_sha) }}
        run: |
          files=$(node scripts/test-shards.mjs files --changed=${{ needs.plan.outputs.base_sha }} --plan=${{ needs.plan.outputs.digest }} --shard=${{ matrix.shard }}/${{ strategy.job-total }})
          npm run test:coverage -- $MODE $files
      # public, like the logs: the repository's own scripts' coverage, without their source text (scripts/raw-coverage.mjs).
      # Named for the tree and the plan, so a re-run that planned other tests never merges this attempt's upload
      - if: needs.plan.outputs.split == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ needs.plan.outputs.sha }}-${{ needs.plan.outputs.base_sha }}-${{ needs.plan.outputs.digest }}-${{ matrix.shard }}
          path: coverage/raw
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  # only the related tests that need a real Mac; the rest ran on Linux
  mac:
    needs: plan
    if: needs.plan.outputs.mac == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_REPO }}
          ref: ${{ needs.plan.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          # the whole history, so the change is measured from its merge base with the target branch
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: '**/package-lock.json' }
      - name: Merge main into the pull request
        env:
          BASE_SHA: '${{ needs.plan.outputs.base_sha }}'
          GIT_AUTHOR_NAME: pr-unit-tests
          GIT_AUTHOR_EMAIL: pr-unit-tests@invalid
          GIT_COMMITTER_NAME: pr-unit-tests
          GIT_COMMITTER_EMAIL: pr-unit-tests@invalid
        run: |
          set -euo pipefail
          git show "$BASE_SHA:scripts/merge-generated.mjs" > "$RUNNER_TEMP/merge-generated.mjs"
          node "$RUNNER_TEMP/merge-generated.mjs" "$BASE_SHA"
      # Electron's download, kept between runs
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm ci
        working-directory: web
      - run: |
          files=$(node scripts/test-shards.mjs files --changed=${{ needs.plan.outputs.base_sha }} --plan=${{ needs.plan.outputs.digest }} --mac)
          npm run test:coverage -- --raw-out coverage/raw $files
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ needs.plan.outputs.sha }}-${{ needs.plan.outputs.base_sha }}-${{ needs.plan.outputs.digest }}-mac
          path: coverage/raw
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  # the fake-based E2E specs the change can break, on up to three macOS runners (the account's five are shared with
  # main-e2e), so a spec still asserting copy or a selector the change removed fails here rather than on main
  e2e:
    needs: plan
    if: needs.plan.outputs.e2e_specs != ''
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.e2e_shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_REPO }}
          ref: ${{ needs.plan.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          # the whole history, so main can be merged in
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - name: Merge main into the pull request
        env:
          BASE_SHA: '${{ needs.plan.outputs.base_sha }}'
          GIT_AUTHOR_NAME: pr-unit-tests
          GIT_AUTHOR_EMAIL: pr-unit-tests@invalid
          GIT_COMMITTER_NAME: pr-unit-tests
          GIT_COMMITTER_EMAIL: pr-unit-tests@invalid
        run: |
          set -euo pipefail
          git show "$BASE_SHA:scripts/merge-generated.mjs" > "$RUNNER_TEMP/merge-generated.mjs"
          node "$RUNNER_TEMP/merge-generated.mjs" "$BASE_SHA"
      # Electron's download, kept between runs
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      # Electron downloads its binary on first use; a network blip there would fail the shard's first test
      - run: node scripts/ensure-electron.cjs || { sleep 10; node scripts/ensure-electron.cjs; } || { sleep 30; node scripts/ensure-electron.cjs; }
      # one retry, so a timing flake does not fail the pull request (main-e2e still runs them without)
      - name: Run the specs
        env: { SPECS: '${{ needs.plan.outputs.e2e_specs }}', SHARD: '${{ matrix.shard }}/${{ strategy.job-total }}' }
        run: |
          set -euo pipefail
          for spec in $SPECS; do
            [[ "$spec" =~ ^tests/e2e/[A-Za-z0-9._-]+\.spec\.ts$ ]] || { echo "::error::Not an E2E spec: $spec"; exit 1; }
          done
          # word splitting of SPECS is the point: one argument per spec path, each checked above
          npx playwright test -c tests/e2e --retries=1 --shard="$SHARD" $SPECS
      # what the page held when a test failed, so a failure only the runner shows can be read from the log
      - if: failure()
        run: |
          for f in test-results/e2e/*/error-context.md; do
            [ -f "$f" ] || continue
            echo "::group::$f"; cat "$f"; echo "::endgroup::"
          done

  # every testing job's coverage as one report, and the changed-line check a single job would have made
  coverage:
    needs: [plan, unit, mac]
    if: ${{ !cancelled() && needs.plan.outputs.split == 'true' && contains(fromJSON('["success", "skipped"]'), needs.unit.result) && contains(fromJSON('["success", "skipped"]'), needs.mac.result) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_REPO }}
          ref: ${{ needs.plan.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          # the whole history, so the change is measured from its merge base with the target branch
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: '**/package-lock.json' }
      - name: Merge main into the pull request
        env:
          BASE_SHA: '${{ needs.plan.outputs.base_sha }}'
          GIT_AUTHOR_NAME: pr-unit-tests
          GIT_AUTHOR_EMAIL: pr-unit-tests@invalid
          GIT_COMMITTER_NAME: pr-unit-tests
          GIT_COMMITTER_EMAIL: pr-unit-tests@invalid
        run: |
          set -euo pipefail
          git show "$BASE_SHA:scripts/merge-generated.mjs" > "$RUNNER_TEMP/merge-generated.mjs"
          node "$RUNNER_TEMP/merge-generated.mjs" "$BASE_SHA"
      # c8 and the coverage check need no Electron
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-${{ needs.plan.outputs.sha }}-${{ needs.plan.outputs.base_sha }}-${{ needs.plan.outputs.digest }}-*
          path: coverage/raw
          merge-multiple: true
      - run: node scripts/test-shards.mjs merge --changed=${{ needs.plan.outputs.base_sha }} coverage/raw

  report:
    needs: [plan, static, unit, mac, coverage, e2e]
    if: ${{ !cancelled() && needs.plan.outputs.sha != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Post the result on the pull request's head commit
        env:
          GH_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          SHA: ${{ needs.plan.outputs.sha }}
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          RESULT: ${{ needs.static.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          SHARDS: ${{ needs.plan.outputs.shards }}
          UNIT_RESULT: ${{ needs.unit.result }}
          MAC: ${{ needs.plan.outputs.mac }}
          MAC_RESULT: ${{ needs.mac.result }}
          SPLIT: ${{ needs.plan.outputs.split }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          E2E_SPECS: ${{ needs.plan.outputs.e2e_specs }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          set -euo pipefail
          # every job the plan needed counts; one it skipped ran nothing that was needed
          need() { if [ "$1" = true ] && [ "$2" != success ]; then RESULT=$2; fi; }
          need true "$PLAN_RESULT"
          need "$([ "$SHARDS" = '[]' ] && echo false || echo true)" "$UNIT_RESULT"
          need "$MAC" "$MAC_RESULT"
          need "$SPLIT" "$COVERAGE_RESULT"
          need "$([ -n "$E2E_SPECS" ] && echo true || echo false)" "$E2E_RESULT"
          # scripts/merge-gate.mjs reads the main commit back from "merged with main <sha>"; at most 140 characters
          if [ "$RESULT" = success ]; then state=success; description="Passed merged with main $BASE_SHA: static checks, ratchet, related unit and E2E tests, coverage"
          else state=failure; description="Failed merged with main $BASE_SHA: merge, static checks, ratchet, unit or E2E tests, or coverage"; fi
          # Retry only transient HTTP errors/timeouts, never permission failures; no test rerun.
          payload=$(jq -cn --arg state "$state" --arg context "$STATUS_CONTEXT" --arg description "$description" \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')
          code=$(curl -q --fail --silent --show-error --proto '=https' --max-time 15 --retry 2 --retry-max-time 30 \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            --header 'Content-Type: application/json' --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-raw "$payload" --output /dev/null --write-out '%{http_code}' \
            "$GITHUB_API_URL/repos/$SOURCE_REPO/statuses/$SHA")
          [ "$code" = 201 ] || { echo "::error::Commit status returned HTTP $code"; exit 1; }
          echo "Pull request ${{ inputs.pr }} at $SHA: $state"
