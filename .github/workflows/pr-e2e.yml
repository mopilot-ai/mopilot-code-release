name: PR E2E specs
# Runs in the public release repository (mopilot-ai/mopilot-code-release), like pr-unit-tests.yml beside it;
# scripts/sync-release-repo.sh copies this file there as .github/workflows/pr-e2e.yml.
# The fake-based E2E specs a pull request can break (docs/unit-coverage.md#e2e-specs), in a run of their own: job
# `e2e-start` of pr-unit-tests.yml picks them and starts this workflow with the head and the main commit it tested.
# The Linux shards post `e2e-specs`, which the merge gate waits for. The specs that need a Mac run after merge, in
# main-e2e and the nightly full run, so a check never waits for a macOS runner; with repository variable PR_E2E_MAC=on
# they run here as before and post `e2e-specs-mac`, which no merge waits for (docs/unit-coverage.md#e2e-specs).
# A run of their own because a newer check of the same head (a retest after main moved, merge-on-green's, one started
# by hand) cancels the older check's run, and the specs outlast `unit-tests`: in that run they were cancelled too, left
# `e2e-specs` pending and wasted the macOS minutes they had spent. Here the runs of one pull request queue one behind
# the other (the concurrency group below never cancels), so a newer run of the same head waits and then carries the
# specs its predecessor just passed (scripts/e2e-carry.mjs, docs/unit-coverage.md#e2e-carry); of several waiting, GitHub
# keeps the newest. A newer head's check cancels this pull request's runs on older heads before it starts its own, and
# job `start` skips a head the pull request no longer has.
#
# Secret SOURCE_TOKEN: the token pr-unit-tests.yml uses (Contents read, Commit statuses read and write, Pull requests
# read). Pull request code runs only after the token has been used, with no credentials left in the checkout.
run-name: ${{ format('E2E specs for pull request {0} at {1} merged with main {2}', inputs.pr, inputs.head, inputs.base) }}
on:
  workflow_dispatch:
    inputs:
      pr: { description: 'Pull request number in the source repository', required: true, type: number }
      head: { description: "The pull request's head commit, which the check tested", required: true, type: string }
      base: { description: 'The main commit the check merged it with', required: true, type: string }
      specs: { description: 'The E2E spec paths the check picked, space-separated', required: true, type: string }
permissions: { contents: read }
concurrency:
  # one run per pull request at a time; a newer one waits instead of cancelling (above)
  group: pr-e2e-${{ inputs.pr }}
  cancel-in-progress: false
env:
  SOURCE_REPO: ${{ vars.SOURCE_REPO }}
  STATUS_CONTEXT: e2e-specs
jobs:
  # the pull request still at this head: mark its specs pending; a head it no longer has runs nothing
  start:
    if: vars.SOURCE_REPO != ''
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
    steps:
      - name: Find the pull request's head and mark the specs pending
        id: pr
        env: { GH_TOKEN: '${{ secrets.SOURCE_TOKEN }}', PR: '${{ inputs.pr }}', SHA: '${{ inputs.head }}', BASE_SHA: '${{ inputs.base }}' }
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::head and base must be full commit ids"; exit 1; }
          # a variable, not a process substitution, so a failed lookup stops the job (set -e)
          info=$(gh api "repos/$SOURCE_REPO/pulls/$PR" --jq '"\(.head.sha) \(.state)"')
          read -r head state <<< "$info"
          # superseded while it waited: the newer head's check started its own run
          if [ "$state" != open ] || [ "$head" != "$SHA" ]; then
            echo "Pull request $PR is $state at $head, not $SHA: nothing to run."
            exit 0
          fi
          # Retry only transient HTTP errors/timeouts, never permission failures; no test rerun.
          payload=$(jq -cn --arg state pending --arg context "$STATUS_CONTEXT" --arg description 'Running the E2E specs this change can break; the merge waits for the Linux ones' \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')
          code=$(curl -q --fail --silent --show-error --proto '=https' --max-time 15 --retry 2 --retry-max-time 30 \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            --header 'Content-Type: application/json' --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-raw "$payload" --output /dev/null --write-out '%{http_code}' \
            "$GITHUB_API_URL/repos/$SOURCE_REPO/statuses/$SHA")
          [ "$code" = 201 ] || { echo "::error::Commit status returned HTTP $code"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

  # Which runner the macOS shards use (docs/mini-runner.md): the owner's Mac mini for the owner's own work while the lane
  # is on and a runner is online, GitHub's otherwise. The decision is main's scripts/mini-lane.mjs, run from a checkout
  # of main (never the pull request's code, which holds no token here); any failure here is GitHub's runner.
  # Only when macOS specs are left to run (the plan says), so a run with none never waits for the mini.
  route:
    needs: [start, plan]
    if: needs.start.outputs.sha != '' && needs.plan.outputs.e2e_run_mac != ''
    runs-on: ubuntu-latest
    # the wait for an offline mini (MINI_WAIT_SECONDS) is at most a few minutes
    timeout-minutes: 10
    # actions: write for the watchdog step
    permissions: { contents: read, actions: write }
    outputs:
      runs_on: ${{ steps.pick.outputs.runs_on || '"macos-15"' }}
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ${{ vars.SOURCE_REPO }}
          ref: main
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        continue-on-error: true
        with: { node-version: 24 }
      # a job that waited too long for the mini (it lost a race for the last idle runner) holds its pull request's runs for
      # up to 24 hours; cancel such runs (only when nothing of theirs runs on the mini) so a retest runs on GitHub's runner,
      # and mark their e2e statuses error (scripts/mini-watchdog.mjs). The job's own token with actions: write, and the
      # source token for the statuses
      # the CI App's token: a result counts only when the App posts it (docs/unit-coverage.md#who-posts-a-result). Until
      # variable CI_APP_ID is set the step is skipped, and if it fails the post still runs: either way with SOURCE_TOKEN,
      # whose result counts only while the owner's login is trusted.
      - id: ci-app
        continue-on-error: true
        if: vars.CI_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with: { app-id: '${{ vars.CI_APP_ID }}', private-key: '${{ secrets.CI_APP_PRIVATE_KEY }}', owner: '${{ github.repository_owner }}', permission-statuses: write }
      - name: Cancel runs stuck waiting for the mini
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MINI_LABEL: ${{ vars.MINI_LABEL }}
          MINI_QUEUE_MINUTES: ${{ vars.MINI_QUEUE_MINUTES }}
          # the statuses of a cancelled pull request run, marked error so the merge gate does not wait on a stale pending
          SOURCE_REPO: ${{ vars.SOURCE_REPO }}
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          STATUS_GH_TOKEN: ${{ steps.ci-app.outputs.token }}
        run: node scripts/mini-watchdog.mjs
      - id: pick
        continue-on-error: true
        env:
          MINI_LANE: ${{ vars.MINI_LANE }}
          MINI_OWNER: ${{ vars.MINI_OWNER }}
          MINI_LABEL: ${{ vars.MINI_LABEL }}
          MINI_WAIT_SECONDS: ${{ vars.MINI_WAIT_SECONDS }}
          # the launcher's slots and this run's macOS shards: a run whose shards do not all fit idle runners goes to GitHub
          MINI_SLOTS: ${{ vars.MINI_SLOTS }}
          MAC_JOBS: ${{ needs.plan.outputs.e2e_jobs_mac }}
          RUNNERS_TOKEN: ${{ secrets.MINI_RUNNERS_TOKEN }}
          # GitHub's own record of who opened the pull request, read with the source token
          PR: ${{ inputs.pr }}
          SOURCE_REPO: ${{ vars.SOURCE_REPO }}
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: node scripts/mini-lane.mjs

  # of the specs the check picked, the ones still to run: the rest carry from an earlier run that passed them on this
  # head, the predecessor this run waited for included (docs/unit-coverage.md#e2e-carry)
  plan:
    needs: start
    if: needs.start.outputs.sha != ''
    runs-on: ubuntu-latest
    # actions: read for the records earlier runs of this workflow left (scripts/e2e-records.mjs)
    permissions: { contents: read, actions: read }
    outputs:
      e2e_run: ${{ steps.carry.outputs.e2e_run }}
      e2e_run_linux: ${{ steps.carry.outputs.e2e_run_linux }}
      e2e_run_mac: ${{ steps.carry.outputs.e2e_run_mac }}
      e2e_matrix: ${{ steps.carry.outputs.e2e_matrix }}
      # e2e_matrix with shard `own` (scripts/e2e-carry.mjs), which job e2e runs
      e2e_jobs: ${{ steps.carry.outputs.e2e_jobs }}
      e2e_carried: ${{ steps.carry.outputs.e2e_carried }}
      # the specs that need a Mac, left to main's runs (scripts/e2e-carry.mjs) unless variable PR_E2E_MAC is `on`
      e2e_deferred_mac: ${{ steps.carry.outputs.e2e_deferred_mac }}
      # e2e_jobs split by runner kind: job e2e takes the Linux shards, job e2e-mac the macOS ones
      e2e_jobs_linux: ${{ steps.split.outputs.linux }}
      e2e_jobs_mac: ${{ steps.split.outputs.mac }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_REPO }}
          ref: ${{ needs.start.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          # the whole history, so main can be merged in and its commits since a record compared
          fetch-depth: 0
          persist-credentials: false
      - id: node
        uses: actions/setup-node@v4
        with: { node-version: 24 }
      # the E2E specs earlier runs passed on this head (scripts/e2e-records.mjs, main's copy, which imports nothing), read
      # before the pull request's code is merged in, so the token that reads them never meets that code; a main from
      # before the script reads none
      - name: Read the E2E specs earlier runs passed on this head
        env:
          GH_TOKEN: ${{ github.token }}
          # the head's own results: which runs failed their E2E jobs
          SOURCE_GH_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          PR: ${{ inputs.pr }}
          HEAD: ${{ needs.start.outputs.sha }}
          BASE_SHA: ${{ needs.start.outputs.base_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          echo '[]' > "$RUNNER_TEMP/e2e-records.json"
          if git show "$BASE_SHA:scripts/e2e-records.mjs" > "$RUNNER_TEMP/e2e-records.mjs" 2> /dev/null; then
            OUT="$RUNNER_TEMP/e2e-records.json" node "$RUNNER_TEMP/e2e-records.mjs"
          fi
      - name: Merge main into the pull request
        env:
          BASE_SHA: '${{ needs.start.outputs.base_sha }}'
          GIT_AUTHOR_NAME: pr-unit-tests
          GIT_AUTHOR_EMAIL: pr-unit-tests@invalid
          GIT_COMMITTER_NAME: pr-unit-tests
          GIT_COMMITTER_EMAIL: pr-unit-tests@invalid
        run: |
          set -euo pipefail
          git show "$BASE_SHA:scripts/merge-generated.mjs" > "$RUNNER_TEMP/merge-generated.mjs"
          node "$RUNNER_TEMP/merge-generated.mjs" "$BASE_SHA"
      # the carry reads the specs' imports and strings, which needs no Electron or install script: it restores what the
      # test jobs saved, and on a miss installs without scripts and saves nothing (docs/unit-coverage.md#install-cache)
      - id: keys
        run: node scripts/ci-install.mjs keys >> "$GITHUB_OUTPUT"
      - id: deps
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ steps.keys.outputs.root }}
      - run: node scripts/ci-install.mjs --root=${{ steps.deps.outputs.cache-hit == 'true' && 'hit' || 'miss' }} --web=skip --mobile=skip --ignore-scripts
      # of the specs the check picked, the ones an earlier run passed on this head and main's newer commits reach none of;
      # job e2e runs the rest
      - id: carry
        env:
          PR: ${{ inputs.pr }}
          HEAD: ${{ needs.start.outputs.sha }}
          MAIN: ${{ needs.start.outputs.base_sha }}
          SPECS: ${{ inputs.specs }}
          RECORDS: ${{ runner.temp }}/e2e-records.json
          PR_E2E_MAC: ${{ vars.PR_E2E_MAC }}
        run: node scripts/e2e-carry.mjs
      - id: split
        env:
          JOBS: '${{ steps.carry.outputs.e2e_jobs || steps.carry.outputs.e2e_matrix }}'
        run: |
          set -euo pipefail
          echo "linux=$(jq -c 'map(select(.runner != "macos-15"))' <<< "${JOBS:-[]}")" >> "$GITHUB_OUTPUT"
          echo "mac=$(jq -c 'map(select(.runner == "macos-15"))' <<< "${JOBS:-[]}")" >> "$GITHUB_OUTPUT"

  # the specs left to run on Linux under xvfb, where the account runs about twenty jobs at once with no queue; the macOS
  # ones are job e2e-mac below
  # The planner runs source code: its runner field cannot allocate a hosted Mac outside the native job's budget.
  e2e:
    needs: [start, plan]
    if: needs.plan.outputs.e2e_run_linux != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.e2e_jobs_linux) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_REPO }}
          ref: ${{ needs.start.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          # the whole history, so main can be merged in
          fetch-depth: 0
          persist-credentials: false
      - id: node
        uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Merge main into the pull request
        env:
          BASE_SHA: '${{ needs.start.outputs.base_sha }}'
          GIT_AUTHOR_NAME: pr-unit-tests
          GIT_AUTHOR_EMAIL: pr-unit-tests@invalid
          GIT_COMMITTER_NAME: pr-unit-tests
          GIT_COMMITTER_EMAIL: pr-unit-tests@invalid
        run: |
          set -euo pipefail
          git show "$BASE_SHA:scripts/merge-generated.mjs" > "$RUNNER_TEMP/merge-generated.mjs"
          node "$RUNNER_TEMP/merge-generated.mjs" "$BASE_SHA"
      # Electron's download, read from what main's runs saved and never saved from here: this job runs the pull request's
      # code, and main's runs and the release restore this key (docs/unit-coverage.md#cache-writes)
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # node_modules between runs, restored instead of `npm ci` (docs/unit-coverage.md#install-cache). The key names the Node
      # the native modules were built for and what npm ci reads (scripts/ci-install.mjs keys); saved right after the install,
      # before any test runs, so a test cannot change what the next run restores
      - id: keys
        run: node scripts/ci-install.mjs keys >> "$GITHUB_OUTPUT"
      - id: deps
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ steps.keys.outputs.root }}
      - run: node scripts/ci-install.mjs --root=${{ steps.deps.outputs.cache-hit == 'true' && 'hit' || 'miss' }} --web=skip
      - if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: { path: node_modules, key: '${{ steps.deps.outputs.cache-primary-key }}' }
      # Electron downloads its binary on first use; a network blip there would fail the shard's first test
      - run: node scripts/ensure-electron.cjs || { sleep 10; node scripts/ensure-electron.cjs; } || { sleep 30; node scripts/ensure-electron.cjs; }
      # Ubuntu's AppArmor keeps Chromium's sandbox from the unprivileged user namespaces it needs, and Electron does not
      # start without it
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The pinned Swift toolchain (about 1 minute), so the E2E setup (tests/e2e/global-setup.ts) builds native/sage-mcp here as
      # on macOS; without it the build is skipped. docs/unit-coverage.md#swift-on-linux
      - if: runner.os == 'Linux'
        run: node scripts/ci-install-swift.mjs
      # one retry, so a timing flake does not fail the pull request (main-e2e still runs them without)
      - name: Run the specs
        env:
          SPECS: "${{ runner.os == 'macOS' && needs.plan.outputs.e2e_run_mac || needs.plan.outputs.e2e_run_linux }}"
          SHARD: '${{ matrix.shard }}'
        run: |
          set -euo pipefail
          for spec in $SPECS; do
            [[ "$spec" =~ ^tests/e2e/[A-Za-z0-9._-]+\.spec\.ts$ ]] || { echo "::error::Not an E2E spec: $spec"; exit 1; }
          done
          [[ "$SHARD" =~ ^[0-9]+/[0-9]+$ || "$SHARD" = own ]] || { echo "::error::Not a shard: $SHARD"; exit 1; }
          # the numbered shards leave the own-runner specs to shard `own` (E2E_RUNNER, read by tests/e2e/playwright.config.ts)
          if [ "$SHARD" = own ]; then export E2E_RUNNER=own; part=(--shard=1/1); else export E2E_RUNNER=shards; part=(--shard="$SHARD"); fi
          # Linux runners have no display: xvfb-run gives the run a virtual one
          if [ "$RUNNER_OS" = Linux ]; then npx=(xvfb-run -a npx); else npx=(npx); fi
          # word splitting of SPECS is the point: one argument per spec path, each checked above
          "${npx[@]}" playwright test -c tests/e2e --retries=1 "${part[@]}" $SPECS
      # what the page held when a test failed, so a failure only the runner shows can be read from the log
      - if: failure()
        run: |
          for f in test-results/e2e/*/error-context.md; do
            [ -f "$f" ] || continue
            echo "::group::$f"; cat "$f"; echo "::endgroup::"
          done

  # The macOS shards, a job of their own so a queue for a Mac (GitHub's, or the owner's mini) never delays the Linux
  # shards' status `e2e-specs`: its report job waits for job e2e only. Same steps as job e2e (tests/prE2eWorkflow.test.ts
  # keeps them equal); the runner is the one job route picked, and the job keeps job e2e's name so
  # scripts/pr-e2e-result.mjs reads its shards.
  e2e-mac:
    name: e2e (${{ matrix.runner }}, ${{ matrix.shard }})
    needs: [start, plan, route]
    # !cancelled(): a route job that failed or timed out leaves the macOS shards on GitHub's runner, never skipped
    if: ${{ !cancelled() && needs.start.outputs.sha != '' && needs.plan.result == 'success' && needs.plan.outputs.e2e_run_mac != '' }}
    runs-on: ${{ fromJSON(needs.route.outputs.runs_on || '"macos-15"') }}
    concurrency:
      group: ${{ contains(needs.route.outputs.runs_on, 'self-hosted') && format('ci-mini-{0}-{1}', github.run_id, matrix.shard) || 'mopilot-hosted-mac-4' }}
      cancel-in-progress: false
      queue: max
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.e2e_jobs_mac) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_REPO }}
          ref: ${{ needs.start.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          # the whole history, so main can be merged in
          fetch-depth: 0
          persist-credentials: false
      - id: node
        uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Merge main into the pull request
        env:
          BASE_SHA: '${{ needs.start.outputs.base_sha }}'
          GIT_AUTHOR_NAME: pr-unit-tests
          GIT_AUTHOR_EMAIL: pr-unit-tests@invalid
          GIT_COMMITTER_NAME: pr-unit-tests
          GIT_COMMITTER_EMAIL: pr-unit-tests@invalid
        run: |
          set -euo pipefail
          git show "$BASE_SHA:scripts/merge-generated.mjs" > "$RUNNER_TEMP/merge-generated.mjs"
          node "$RUNNER_TEMP/merge-generated.mjs" "$BASE_SHA"
      # Electron's download, read from what main's runs saved and never saved from here: this job runs the pull request's
      # code, and main's runs and the release restore this key (docs/unit-coverage.md#cache-writes)
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # node_modules between runs, restored instead of `npm ci` (docs/unit-coverage.md#install-cache). The key names the Node
      # the native modules were built for and what npm ci reads (scripts/ci-install.mjs keys); saved right after the install,
      # before any test runs, so a test cannot change what the next run restores
      - id: keys
        run: node scripts/ci-install.mjs keys >> "$GITHUB_OUTPUT"
      - id: deps
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ steps.keys.outputs.root }}
      - run: node scripts/ci-install.mjs --root=${{ steps.deps.outputs.cache-hit == 'true' && 'hit' || 'miss' }} --web=skip
      - if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: { path: node_modules, key: '${{ steps.deps.outputs.cache-primary-key }}' }
      # Electron downloads its binary on first use; a network blip there would fail the shard's first test
      - run: node scripts/ensure-electron.cjs || { sleep 10; node scripts/ensure-electron.cjs; } || { sleep 30; node scripts/ensure-electron.cjs; }
      # Ubuntu's AppArmor keeps Chromium's sandbox from the unprivileged user namespaces it needs, and Electron does not
      # start without it
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The pinned Swift toolchain (about 1 minute), so the E2E setup (tests/e2e/global-setup.ts) builds native/sage-mcp here as
      # on macOS; without it the build is skipped. docs/unit-coverage.md#swift-on-linux
      - if: runner.os == 'Linux'
        run: node scripts/ci-install-swift.mjs
      # one retry, so a timing flake does not fail the pull request (main-e2e still runs them without)
      - name: Run the specs
        env:
          SPECS: "${{ runner.os == 'macOS' && needs.plan.outputs.e2e_run_mac || needs.plan.outputs.e2e_run_linux }}"
          SHARD: '${{ matrix.shard }}'
        run: |
          set -euo pipefail
          for spec in $SPECS; do
            [[ "$spec" =~ ^tests/e2e/[A-Za-z0-9._-]+\.spec\.ts$ ]] || { echo "::error::Not an E2E spec: $spec"; exit 1; }
          done
          [[ "$SHARD" =~ ^[0-9]+/[0-9]+$ || "$SHARD" = own ]] || { echo "::error::Not a shard: $SHARD"; exit 1; }
          # the numbered shards leave the own-runner specs to shard `own` (E2E_RUNNER, read by tests/e2e/playwright.config.ts)
          if [ "$SHARD" = own ]; then export E2E_RUNNER=own; part=(--shard=1/1); else export E2E_RUNNER=shards; part=(--shard="$SHARD"); fi
          # Linux runners have no display: xvfb-run gives the run a virtual one
          if [ "$RUNNER_OS" = Linux ]; then npx=(xvfb-run -a npx); else npx=(npx); fi
          # word splitting of SPECS is the point: one argument per spec path, each checked above
          "${npx[@]}" playwright test -c tests/e2e --retries=1 "${part[@]}" $SPECS
      # what the page held when a test failed, so a failure only the runner shows can be read from the log
      - if: failure()
        run: |
          for f in test-results/e2e/*/error-context.md; do
            [ -f "$f" ] || continue
            echo "::group::$f"; cat "$f"; echo "::endgroup::"
          done

  # The E2E specs' result as two statuses, each posted by a job that waits only for its own shards: `e2e-specs`, the Linux
  # shards', which the merge gate waits for, so a spec the change left stale is fixed before it merges, and
  # `e2e-specs-mac` (job e2e-report-mac), the macOS shards', which no merge waits for, since a Mac can queue for an hour
  # (GitHub's) or longer (the owner's mini). A Linux failure only in quarantined specs passes (scripts/pr-e2e-result.mjs,
  # from main's checkout: no pull request code runs here).
  e2e-report:
    needs: [start, plan, e2e]
    if: ${{ !cancelled() && needs.start.outputs.sha != '' }}
    runs-on: ubuntu-latest
    # actions: read for this run's jobs and their logs
    permissions: { contents: read, actions: read }
    steps:
      # main's tip, never a commit an input names: this job holds SOURCE_TOKEN, so it runs only code already merged. A
      # step that fails leaves the job's own result to be posted, as before the split
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ${{ vars.SOURCE_REPO }}
          ref: main
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        continue-on-error: true
        with: { node-version: 24 }
      - name: Split the result by runner kind
        id: kinds
        if: needs.e2e.result != 'skipped'
        continue-on-error: true
        env: { GH_TOKEN: '${{ github.token }}', SOURCE_TOKEN: '${{ secrets.SOURCE_TOKEN }}' }
        run: node scripts/pr-e2e-result.mjs
      # the CI App's token: a result counts only when the App posts it (docs/unit-coverage.md#who-posts-a-result). Until
      # variable CI_APP_ID is set the step is skipped, and if it fails the post still runs: either way with SOURCE_TOKEN,
      # whose result counts only while the owner's login is trusted.
      - id: ci-app
        if: vars.CI_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with: { app-id: '${{ vars.CI_APP_ID }}', private-key: '${{ secrets.CI_APP_PRIVATE_KEY }}', owner: '${{ github.repository_owner }}', permission-statuses: write }
      - name: Post the E2E specs' result on the pull request's head commit
        env:
          GH_TOKEN: ${{ steps.ci-app.outputs.token || secrets.SOURCE_TOKEN }}
          SHA: ${{ needs.start.outputs.sha }}
          # the Linux shards' result (`none`: no Linux shard ran); the job's own when it could not be split
          # job e2e is skipped when only macOS specs are left: nothing to run on Linux
          # and when every spec it picked needs a Mac: those run after merge (e2e_deferred_mac)
          E2E_RESULT: ${{ steps.kinds.outputs.linux || (needs.e2e.result == 'skipped' && (needs.plan.outputs.e2e_run != '' || needs.plan.outputs.e2e_deferred_mac != '') && 'none') || needs.e2e.result }}
          E2E_RUN: ${{ needs.plan.outputs.e2e_run_linux }}
          E2E_CARRIED: ${{ needs.plan.outputs.e2e_carried }}
          E2E_RUN_ALL: ${{ needs.plan.outputs.e2e_run }}
          NOTE: ${{ steps.kinds.outputs.note }}
          DEFERRED: ${{ needs.plan.outputs.e2e_deferred_mac }}
        run: |
          set -euo pipefail
          # every spec passed on this head before, and main's newer commits reach none of them (step carry): job e2e skipped
          carried=${E2E_CARRIED:-0}
          # with specs still to run on a Mac (E2E_RUN_ALL), the Linux ones carried and e2e-specs-mac posts the rest
          if [ -z "${E2E_RUN:-}" ] && [ "$carried" -gt 0 ]; then
            if [ -n "${E2E_RUN_ALL:-}" ]; then E2E_RESULT=carried-linux; else E2E_RESULT=carried; fi
          fi
          # the ones that ran, and how many carried with them
          if [ "$carried" -gt 0 ]; then ran="the E2E specs this change can break, $carried carried from an earlier run"; else ran='the E2E specs this change can break'; fi
          # the ones that need a Mac run after merge (main-e2e), not here
          deferred=$(wc -w <<< "${DEFERRED:-}" | tr -d ' ')
          if [ "$deferred" -gt 0 ]; then later="; $deferred needing a Mac run after merge"; else later=''; fi
          # at most 140 characters; a job that never finished (cancelled, or no runner) is neither a pass nor a stale spec
          # the merge gate waits for this status and holds a failure; `error` (never finished) holds nothing
          case "$E2E_RESULT" in
            carried-linux) state=success; description="Passed: the Linux E2E specs this change can break carried from an earlier run on this head; the macOS ones post e2e-specs-mac" ;;
            carried) state=success; description="Passed: all $carried E2E specs this change can break carried from an earlier run on this head${later}" ;;
            success) state=success; description="Passed: $ran, on Linux${NOTE:-}${later}" ;;
            none) state=success; description="Passed: none of the E2E specs this change can break runs on Linux${later:-; the macOS ones post e2e-specs-mac}" ;;
            failure) state=failure; description='Failed: an E2E spec this change can break, on Linux; fix it in this pull request before it merges' ;;
            *) state=error; description="Did not finish ($E2E_RESULT): the E2E specs this change can break, on Linux" ;;
          esac
          description=${description:0:140}
          # Retry only transient HTTP errors/timeouts, never permission failures; no test rerun.
          payload=$(jq -cn --arg state "$state" --arg context "$STATUS_CONTEXT" --arg description "$description" \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')
          code=$(curl -q --fail --silent --show-error --proto '=https' --max-time 15 --retry 2 --retry-max-time 30 \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            --header 'Content-Type: application/json' --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-raw "$payload" --output /dev/null --write-out '%{http_code}' \
            "$GITHUB_API_URL/repos/$SOURCE_REPO/statuses/$SHA")
          [ "$code" = 201 ] || { echo "::error::Commit status returned HTTP $code"; exit 1; }
          echo "E2E specs for pull request ${{ inputs.pr }} at $SHA: $state"

  # The macOS shards' own status, which no merge waits for; posted when job e2e-mac ends, whatever the Linux shards do
  e2e-report-mac:
    needs: [start, plan, e2e-mac]
    if: ${{ !cancelled() && needs.start.outputs.sha != '' && needs.plan.outputs.e2e_run_mac != '' }}
    runs-on: ubuntu-latest
    # actions: read for this run's jobs and their logs
    permissions: { contents: read, actions: read }
    steps:
      # main's tip, never a commit an input names: this job holds SOURCE_TOKEN, so it runs only code already merged. A
      # step that fails leaves the job's own result to be posted, as before the split
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ${{ vars.SOURCE_REPO }}
          ref: main
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        continue-on-error: true
        with: { node-version: 24 }
      - name: Split the result by runner kind
        id: kinds
        if: needs.e2e-mac.result != 'skipped'
        continue-on-error: true
        env: { GH_TOKEN: '${{ github.token }}', SOURCE_TOKEN: '${{ secrets.SOURCE_TOKEN }}' }
        run: node scripts/pr-e2e-result.mjs
      # the CI App's token: a result counts only when the App posts it (docs/unit-coverage.md#who-posts-a-result). Until
      # variable CI_APP_ID is set the step is skipped, and if it fails the post still runs: either way with SOURCE_TOKEN,
      # whose result counts only while the owner's login is trusted.
      - id: ci-app
        if: vars.CI_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with: { app-id: '${{ vars.CI_APP_ID }}', private-key: '${{ secrets.CI_APP_PRIVATE_KEY }}', owner: '${{ github.repository_owner }}', permission-statuses: write }
      - name: Post the macOS E2E specs' result on the pull request's head commit
        env:
          GH_TOKEN: ${{ steps.ci-app.outputs.token || secrets.SOURCE_TOKEN }}
          SHA: ${{ needs.start.outputs.sha }}
          STATUS_CONTEXT: e2e-specs-mac
          E2E_RESULT: ${{ steps.kinds.outputs.mac || needs.e2e-mac.result }}
        run: |
          set -euo pipefail
          case "$E2E_RESULT" in
            success) state=success; description='Passed: the E2E specs this change can break that need a Mac (advisory)' ;;
            failure) state=failure; description='Failed: an E2E spec this change can break that needs a Mac; fix it in this pull request or right after (advisory)' ;;
            *) state=error; description="Did not finish ($E2E_RESULT): the E2E specs this change can break that need a Mac (advisory)" ;;
          esac
          # Retry only transient HTTP errors/timeouts, never permission failures; no test rerun.
          payload=$(jq -cn --arg state "$state" --arg context "$STATUS_CONTEXT" --arg description "$description" \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')
          code=$(curl -q --fail --silent --show-error --proto '=https' --max-time 15 --retry 2 --retry-max-time 30 \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            --header 'Content-Type: application/json' --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-raw "$payload" --output /dev/null --write-out '%{http_code}' \
            "$GITHUB_API_URL/repos/$SOURCE_REPO/statuses/$SHA")
          [ "$code" = 201 ] || { echo "::error::Commit status returned HTTP $code"; exit 1; }
          echo "macOS E2E specs for pull request ${{ inputs.pr }} at $SHA: $state"

  # What passed on this head, for a later run to carry (scripts/e2e-carry.mjs): written when every shard that ran, Linux
  # and macOS, passed. A job with no pull request code and no token; a record that fails to upload only means the next
  # run of this head runs the specs again
  e2e-record:
    needs: [start, plan, e2e, e2e-mac]
    if: ${{ !cancelled() && needs.start.outputs.sha != '' && needs.plan.outputs.e2e_run != '' && (needs.e2e.result == 'success' || (needs.e2e.result == 'skipped' && needs.plan.outputs.e2e_run_linux == '')) && (needs.e2e-mac.result == 'success' || (needs.e2e-mac.result == 'skipped' && needs.plan.outputs.e2e_run_mac == '')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Record the E2E specs that passed
        continue-on-error: true
        env:
          PR: ${{ inputs.pr }}
          SHA: ${{ needs.start.outputs.sha }}
          BASE_SHA: ${{ needs.start.outputs.base_sha }}
          E2E_RUN: ${{ needs.plan.outputs.e2e_run }}
          E2E_RUN_LINUX: ${{ needs.plan.outputs.e2e_run_linux }}
          E2E_RUN_MAC: ${{ needs.plan.outputs.e2e_run_mac }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/e2e-passed"
          jq -n --argjson pr "$PR" --arg head "$SHA" --arg base "$BASE_SHA" --arg specs "$E2E_RUN" --arg linux "$E2E_RUN_LINUX" --arg mac "$E2E_RUN_MAC" \
            '{version: 1, pr: $pr, head: $head, base: $base, specs: ($specs | split(" ") | map(select(. != ""))), linux: ($linux | split(" ") | map(select(. != ""))), mac: ($mac | split(" ") | map(select(. != "")))}' > "$RUNNER_TEMP/e2e-passed/record.json"
      - continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: e2e-passed-${{ needs.start.outputs.sha }}
          path: ${{ runner.temp }}/e2e-passed/record.json
          if-no-files-found: error
          retention-days: 14
