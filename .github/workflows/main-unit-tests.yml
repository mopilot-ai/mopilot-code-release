name: Main unit tests
# Runs in the public release repository (mopilot-ai/mopilot-code-release, where Actions minutes are free), like
# pr-unit-tests.yml beside it; scripts/sync-release-repo.sh copies this file there as
# .github/workflows/main-unit-tests.yml.
# main-validation.yml captures one source SHA and calls this workflow alongside E2E. The cycle reuses successes
# and retries a failed/missing suite once on that same SHA. Manual dispatch remains available for diagnosis.
# Every testing job has a 25-minute deadline; the sweep reconciles stopped runs that never published a result.
# The suite runs on Linux, and job `mac` runs the tests that need a real Mac (scripts/mac-only-tests.mjs --all) on
# macOS, so a run holds one of the five macOS slots only for those (docs/unit-coverage.md#runners).
# Started by hand for one commit: gh workflow run main-unit-tests.yml -R mopilot-ai/mopilot-code-release -f sha=<sha>
#
# Secret SOURCE_TOKEN: the token pr-unit-tests.yml uses (Contents read, Commit statuses read and write), plus Issues
# read and write for the main-red issue.
run-name: ${{ inputs.sha && format('Unit tests for main at {0}', inputs.sha) || 'Unit tests for main' }}
on:
  workflow_call:
    inputs:
      sha: { required: true, type: string }
      scope: { required: false, type: string, default: '' }
      reuse_success: { required: false, type: boolean, default: true }
      # the paired cycle retries this suite on this SHA if it fails: its failure is left to the retry's report
      retry_follows: { required: false, type: boolean, default: false }
    secrets:
      SOURCE_TOKEN: { required: true }
      # the CI App's key, which posts the results (docs/unit-coverage.md#who-posts-a-result); without it SOURCE_TOKEN does
      CI_APP_PRIVATE_KEY: { required: false }
    # the result the report job posted ('' when none was posted), which the paired cycle's retry follows: a job that
    # never got a runner leaves the suite `abandoned`, a result the caller cannot tell from the others
    outputs:
      state: { value: '${{ jobs.report.outputs.state }}' }
      # 'false' when a fixes-main merge landed after this SHA and the report recorded the failure: the cycle skips its retry
      retry: { value: '${{ jobs.report.outputs.retry }}' }
  workflow_dispatch:
    inputs:
      sha: { description: 'Commit of main to test (default: the newest)', required: false, type: string }
permissions: { contents: read }
concurrency:
  # one run at a time; a newer scheduled run waits instead of cancelling one already testing
  group: main-unit-tests
  cancel-in-progress: false
env:
  SOURCE_REPO: ${{ vars.SOURCE_REPO }}
  STATUS_CONTEXT: main-unit-tests

jobs:
  pick:
    if: vars.SOURCE_REPO != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - name: Pick main's commit and mark it pending
        id: pick
        env: { GH_TOKEN: '${{ secrets.SOURCE_TOKEN }}', SHA: '${{ inputs.sha }}', REUSE_SUCCESS: '${{ inputs.reuse_success }}' }
        run: |
          set -euo pipefail
          sha=${SHA:-$(gh api "repos/$SOURCE_REPO/git/ref/heads/main" --jq .object.sha)}
          # Status reads accept abbreviated SHAs, but creating a status needs the full commit identity.
          if [ -n "${SHA:-}" ] && ! [[ "$sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            [[ "$sha" =~ ^[0-9a-fA-F]{1,39}$ ]] || { echo "::error::Expected a full or abbreviated commit SHA"; exit 1; }
            short_sha=$sha
            sha=$(gh api "repos/$SOURCE_REPO/commits/$short_sha" --jq .sha) || {
              echo "::error::Could not resolve the abbreviated commit SHA"; exit 1;
            }
            # Check identity as well as shape; keep case matching local to this test (also works on Bash 3).
            if ! [[ "$sha" =~ ^[0-9a-fA-F]{40}$ ]] || ! (shopt -s nocasematch; [[ "$sha" == "$short_sha"* ]]); then
              echo "::error::Could not resolve the abbreviated commit SHA"; exit 1;
            fi
          fi
          # A report/issue failure or a concurrent manual run must not erase a completed successful suite.
          if [ "${REUSE_SUCCESS:-false}" = true ]; then
            state=$(gh api "repos/$SOURCE_REPO/commits/$sha/statuses?per_page=100" --jq "[.[] | select(.context == \"$STATUS_CONTEXT\")][0].state")
            if [ "$state" = success ]; then echo "Keeping completed $STATUS_CONTEXT at $sha"; exit 0; fi
          fi
          # Retry only transient HTTP errors/timeouts, never permission failures; no test rerun.
          payload=$(jq -cn --arg state pending --arg context "$STATUS_CONTEXT" --arg description 'Running the full unit suite' \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')
          code=$(curl -q --fail --silent --show-error --proto '=https' --max-time 15 --retry 2 --retry-max-time 30 \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            --header 'Content-Type: application/json' --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-raw "$payload" --output /dev/null --write-out '%{http_code}' \
            "$GITHUB_API_URL/repos/$SOURCE_REPO/statuses/$sha")
          [ "$code" = 201 ] || { echo "::error::Commit status returned HTTP $code"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # npm test split over three Linux runners (node --test-shard through UNIT_TEST_SHARD), so the suite takes about a
  # third of its ten minutes; the first shard also typechecks and runs the web app's tests
  test:
    needs: pick
    if: needs.pick.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_REPO }}
          ref: ${{ needs.pick.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: '**/package-lock.json' }
      # Electron's download, kept between runs
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # as the PR check installs (scripts/ci-install.mjs): the root, and the phone app's packages its tests and its type
      # check resolve (without their native install scripts); web/ has its own step below
      - run: node scripts/ci-install.mjs --root=miss --web=skip
      - if: matrix.shard == 1
        run: npm run typecheck
      # the steps that run tests are named, and the report lists them (TEST_STEPS): a failure in any other step names
      # no test file, so it can never read as main's known red (docs/unit-coverage.md#known-red-baseline)
      - name: Run the unit tests
        run: npm test
        env: { UNIT_TEST_SHARD: '${{ matrix.shard }}/3' }
      - if: matrix.shard == 1
        run: npm ci && npm run typecheck
        working-directory: web
      - name: Run the web tests
        if: matrix.shard == 1
        run: npm test
        working-directory: web

  # the tests that need a real Mac, which the Linux job skips or checks only in part
  mac:
    needs: pick
    if: needs.pick.outputs.sha != ''
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_REPO }}
          ref: ${{ needs.pick.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: '**/package-lock.json' }
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: node scripts/ci-install.mjs --root=miss --web=skip
      # npm test's flags on just these files (measured, not enforced: the coverage gate is the pull request's)
      - name: Run the Mac-only tests
        run: files=$(node scripts/mac-only-tests.mjs --all); [ -z "$files" ] || npm run test:coverage -- --report-only $files

  # the runners job rust tests the core on (scripts/main-core-scope.mjs): Linux always, macOS and Windows only when the
  # core changed since main's last green run, so they do not take a macOS slot from the E2E shards when it did not. A job
  # that leaves no answer (a commit from before the script, a failure) counts as a change: every runner
  rust-scope:
    needs: pick
    if: needs.pick.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    outputs:
      os: ${{ steps.scope.outputs.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_REPO }}
          ref: ${{ needs.pick.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          # the history, to find the last green run's commit and what changed since
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - id: scope
        if: hashFiles('scripts/main-core-scope.mjs') != ''
        env: { GH_TOKEN: '${{ secrets.SOURCE_TOKEN }}', SHA: '${{ needs.pick.outputs.sha }}' }
        run: node scripts/main-core-scope.mjs

  # the Rust core's tests on Linux, macOS and Windows (docs/architecture/rust-core.md §9), on the toolchain
  # core/rust-toolchain.toml pins; one runner's failure does not cancel the others
  rust:
    needs: [pick, rust-scope]
    if: ${{ !cancelled() && needs.pick.outputs.sha != '' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.rust-scope.outputs.os || '["ubuntu-latest", "macos-15", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_REPO }}
          ref: ${{ needs.pick.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - run: rustup toolchain install && cargo test --locked
        working-directory: core

  report:
    needs: [pick, test, mac, rust]
    if: ${{ !cancelled() && needs.pick.outputs.sha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # actions: read for the failed jobs' logs, which name the failing tests
    permissions: { contents: read, actions: read }
    outputs:
      state: ${{ steps.post.outputs.state }}
      retry: ${{ steps.issue.outputs.retry }}
    steps:
      # the CI App's token: a result counts only when the App posts it (docs/unit-coverage.md#who-posts-a-result). Until
      # variable CI_APP_ID is set the step is skipped, and if it fails the post still runs: either way with SOURCE_TOKEN,
      # whose result counts only while the owner's login is trusted.
      - id: ci-app
        if: vars.CI_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with: { app-id: '${{ vars.CI_APP_ID }}', private-key: '${{ secrets.CI_APP_PRIVATE_KEY }}', owner: '${{ github.repository_owner }}', permission-statuses: write }
      - name: Post the result on main's commit
        id: post
        env:
          GH_TOKEN: ${{ steps.ci-app.outputs.token || secrets.SOURCE_TOKEN }}
          SHA: ${{ needs.pick.outputs.sha }}
          RESULT: ${{ needs.test.result }}
          MAC_RESULT: ${{ needs.mac.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          set -euo pipefail
          if [ "$MAC_RESULT" != success ]; then RESULT=$MAC_RESULT; fi
          if [ "$RUST_RESULT" != success ]; then RESULT=$RUST_RESULT; fi
          if [ "$RESULT" = success ]; then state=success; description='Typecheck, the full unit suite, the web tests and the core tests passed'
          else state=failure; description='Typecheck, the full unit suite, the web tests or the core tests failed'; fi
          # Retry only transient HTTP errors/timeouts, never permission failures; no test rerun.
          payload=$(jq -cn --arg state "$state" --arg context "$STATUS_CONTEXT" --arg description "$description" \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')
          code=$(curl -q --fail --silent --show-error --proto '=https' --max-time 15 --retry 2 --retry-max-time 30 \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            --header 'Content-Type: application/json' --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-raw "$payload" --output /dev/null --write-out '%{http_code}' \
            "$GITHUB_API_URL/repos/$SOURCE_REPO/statuses/$SHA")
          [ "$code" = 201 ] || { echo "::error::Commit status returned HTTP $code"; exit 1; }
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "main at $SHA: $state"
      # one open issue per red run on main (label main-red), closed when it passes (scripts/main-red-issue.mjs); needs
      # SOURCE_TOKEN to have Issues read and write. A failure here leaves the status above in place. It names the likely
      # cause from main's history and the import graph of this checkout (docs/unit-coverage.md#fix-forward); it pushes
      # nothing and opens no pull request.
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_REPO }}
          ref: ${{ needs.pick.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      # the Node the scripts are written for, not whichever the runner image ships
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      # the failed jobs' logs, which name the failing tests, and every failed step that ran none (scripts/e2e-quarantine.mjs);
      # an empty file is a log that could not be read
      - name: Read the failed jobs' logs
        if: needs.test.result != 'success' || needs.mac.result != 'success' || needs.rust.result != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SCOPE: ${{ inputs.scope }}
          TEST_STEPS: |
            Run the unit tests
            Run the web tests
            Run the Mac-only tests
        run: node scripts/e2e-quarantine.mjs logs "$RUNNER_TEMP/failed.log"
      - name: Open, update or close the main-red issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          STATUS_GH_TOKEN: ${{ steps.ci-app.outputs.token }}
          RETRY_FOLLOWS: ${{ inputs.retry_follows }}
          RED_HOLD: ${{ vars.RED_HOLD }}
          SHA: ${{ needs.pick.outputs.sha }}
          RESULT: ${{ needs.test.result }}
          MAC_RESULT: ${{ needs.mac.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          set -euo pipefail
          if [ "$RESULT" = success ] && [ "$MAC_RESULT" = success ] && [ "$RUST_RESULT" = success ]; then state=success; else state=failure; fi
          [ -f "$RUNNER_TEMP/failed.log" ] || : > "$RUNNER_TEMP/failed.log"
          GH_TOKEN=$SOURCE_TOKEN node scripts/main-red-issue.mjs main-unit-tests "$SHA" "$state" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$RUNNER_TEMP/failed.log"
