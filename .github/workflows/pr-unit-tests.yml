name: PR unit tests
# Runs in the public release repository (mopilot-ai/mopilot-code-release, where Actions minutes are free), not in
# the private source repository named by variable SOURCE_REPO. scripts/sync-release-repo.sh copies this file
# there as .github/workflows/pr-unit-tests.yml. It lives outside .github/workflows here so the source
# repository never schedules it.
# For a pull request against main it runs the checks the pre-commit hook runs (scripts/precommit.mjs: Biome's
# format and lint errors, both TypeScript configs and the source header comments, plus the web app's types), so a commit
# made where the hook did not run is still checked; then the lint ratchet (npm run lint:ratchet --
# --base=<main>; docs/bug-prevention/README.md) and the unit tests that reach the change, with changed-line coverage enforced
# (npm run test:coverage -- --changed=<main> --related; docs/unit-coverage.md), on the pull request's head commit
# merged with main as it is when the run starts, and posts the result on the head commit as the commit status
# `unit-tests`, naming that main commit ("merged with main <sha>"). The module map is generated and not committed; a
# branch from before that still holds it, and the merge drops it (scripts/merge-generated.mjs), so a conflict only there
# does not fail the check; any other conflict does. A change without source or test files passes without running tests. Merges go through the merge gate (scripts/merge-gate.mjs).
# Job `plan` finds the related tests and splits them (scripts/test-shards.mjs): the free plan here runs five macOS jobs
# at once and about twenty Linux ones, so job `static` runs the static checks, job `unit` runs the tests on up to three
# Linux shards, job `mac` runs only the related tests that need a real Mac (scripts/mac-only-tests.mjs), and when more
# than one job tested, job `coverage` merges their raw coverage into one report and checks the changed lines
# (docs/unit-coverage.md#runners). A change one Linux shard can test checks its coverage in that shard. Job `plan` also
# picks the fake-based E2E specs the change can break (scripts/e2e-select.mjs), and job `e2e-start` runs them in a
# workflow of their own, pr-e2e.yml: on up to six Linux runners under xvfb, and the few that need a Mac on one macOS
# runner (docs/unit-coverage.md#e2e-specs). `unit-tests` does not count them: they post their result as their own
# statuses, `e2e-specs` for the Linux shards, which the merge gate waits for and holds a failure of, and `e2e-specs-mac`,
# which no merge waits for; main-e2e is the net after the merge. In their own run, a newer check of the same head, which cancels
# this one, does not cancel them: its own E2E run waits for theirs and carries what they passed
# (docs/unit-coverage.md#e2e-carry).
# Started per pull request (node scripts/pr-check-start.mjs <n>, which marks the head `Queued` first). When it
# finishes, sweep.yml runs: it starts this check for open pull requests whose head has none and merges pull requests
# labeled `merge-on-green` that the merge gate allows, so an agent asked to merge does not have to poll.
#
# Secret SOURCE_TOKEN: a fine-grained token owned by the source repository's organization, on that
# repository, with Contents read and write (release.yml pushes tags), Commit statuses read and write and
# Pull requests read. Run logs here are public, as release.yml's are: they show pull request numbers, commit
# ids and test output, never pull request titles or bodies. Pull request code runs only after the token has
# been used, with no credentials left in the checkout.
run-name: ${{ format('Unit tests for pull request {0}', inputs.pr) }}${{ inputs.audit_of != '' && format(' (audit of {0})', inputs.audit_of) || inputs.fallback_of != '' && format(' (GitHub fallback of {0})', inputs.fallback_of) || '' }}
on:
  workflow_dispatch:
    inputs:
      pr: { description: 'Pull request number in the source repository', required: true, type: number }
      mac_pool: { description: 'Automatic local/GitHub pool, or a GitHub-only spillover', required: false, type: choice, options: [auto, github], default: auto }
      fallback_of: { description: 'Parent run of an automatic spillover', required: false, type: string, default: '' }
      fallback_head: { description: 'Source head owned by the spillover', required: false, type: string, default: '' }
      # an audit of a run whose macOS job ran on a sealed local runner (docs/local-runner.md): the run's id, the head and
      # main it tested, its macOS result and the runner's owner. The audit runs that job on GitHub and posts no status.
      audit_of: { description: 'Run id of the local run to audit (empty: a normal check)', required: false, type: string, default: '' }
      audit_head: { required: false, type: string, default: '' }
      audit_base: { required: false, type: string, default: '' }
      audit_result: { required: false, type: string, default: '' }
      audit_owner: { required: false, type: string, default: '' }
permissions: { contents: read }
concurrency:
  # a newer run for the same pull request supersedes an older one; an audit supersedes only an older audit
  group: pr-unit-tests-${{ inputs.pr }}${{ inputs.audit_of != '' && '-audit' || inputs.fallback_of != '' && format('-fallback-{0}', inputs.fallback_of) || '' }}
  cancel-in-progress: true
env:
  SOURCE_REPO: ${{ vars.SOURCE_REPO }}
  STATUS_CONTEXT: unit-tests
jobs:
  # the pull request's head and main as they are now, which every other job tests, and how the related tests split
  plan:
    if: vars.SOURCE_REPO != ''
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      reason: ${{ steps.pr.outputs.reason }}
      shards: ${{ steps.split.outputs.shards }}
      mac: ${{ steps.split.outputs.mac }}
      rust: ${{ steps.split.outputs.rust }}
      split: ${{ steps.split.outputs.split }}
      digest: ${{ steps.split.outputs.digest }}
      parts: ${{ steps.split.outputs.parts }}
      e2e_specs: ${{ steps.e2e.outputs.e2e_specs }}
      web: ${{ steps.split.outputs.web }}
      static: ${{ steps.split.outputs.static }}
    steps:
      - name: Find the pull request's head and mark it pending
        id: pr
        env: { GH_TOKEN: '${{ secrets.SOURCE_TOKEN }}', PR: '${{ inputs.pr }}', AUDIT_HEAD: '${{ inputs.audit_head }}', AUDIT_BASE: '${{ inputs.audit_base }}', FALLBACK_HEAD: '${{ inputs.fallback_head }}', FALLBACK_OF: '${{ inputs.fallback_of }}', MAC_POOL: '${{ inputs.mac_pool }}' }
        run: |
          set -euo pipefail
          if [ -n "${AUDIT_HEAD:-}" ]; then
            # an audit (docs/local-runner.md) tests what the local run tested; a head the pull request left has nothing to compare
            head=$(gh api "repos/$SOURCE_REPO/pulls/$PR" --jq .head.sha)
            if [ "$head" != "$AUDIT_HEAD" ]; then echo "Pull request $PR moved past $AUDIT_HEAD: nothing to audit."; exit 0; fi
            { echo "sha=$AUDIT_HEAD"; echo "base=main"; echo "base_sha=$AUDIT_BASE"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # a variable, not a process substitution, so a failed lookup stops the job (set -e)
          # main is the default branch, not the pull request's base: one stacked on another branch is still tested
          # (and its status named) against main, which the merge gate reads (#1766)
          info=$(gh api "repos/$SOURCE_REPO/pulls/$PR" --jq '"\(.head.sha) \(.base.repo.default_branch) \(.state)"')
          read -r sha base state <<< "$info"
          [ "$state" = open ] || { echo "::error::Pull request $PR is $state."; exit 1; }
          if [ -n "${FALLBACK_HEAD:-}${FALLBACK_OF:-}" ]; then
            [[ "${FALLBACK_HEAD:-}" =~ ^[0-9a-f]{40}$ && "${FALLBACK_OF:-}" =~ ^[1-9][0-9]*$ && "${MAC_POOL:-}" = github ]] || { echo "::error::Invalid spillover identity"; exit 1; }
            [ "$sha" = "$FALLBACK_HEAD" ] || { echo "Spillover retired: pull request head changed."; exit 0; }
          fi
          # main as it is now: the pull request is tested merged with it, and the status names it
          base_sha=$(gh api "repos/$SOURCE_REPO/git/ref/heads/$base" --jq .object.sha)
          # Preserve the launcher's reason before the running status replaces its queued status.
          why=$(gh api "repos/$SOURCE_REPO/commits/$sha/statuses?per_page=100" --jq '[.[] | select(.context == "unit-tests" and (.description // "" | startswith("Queued")))][0].description // "Not recorded by this dispatcher"') || why='Queue reason lookup failed'
          # Retry only transient HTTP errors/timeouts, never permission failures; no test rerun.
          payload=$(jq -cn --arg state pending --arg context "$STATUS_CONTEXT" --arg description 'Running the unit tests that reach this change' \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')
          # Recheck after network lookups, immediately before publication. The status API has no conditional write.
          if [ -n "${FALLBACK_OF:-}" ]; then
            owner=$(gh api "repos/$SOURCE_REPO/commits/$sha/statuses?per_page=100" --jq '[.[] | select(.context == "unit-tests")][0] | select(.state == "pending") | .target_url // ""')
            [ "$owner" = "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$FALLBACK_OF?mac_pool=github" ] || { echo "Spillover retired: a newer check owns this head."; exit 0; }
          fi
          { echo "sha=$sha"; echo "base=$base"; echo "base_sha=$base_sha"; echo "reason=$(printf '%s' "$why" | tr '\r\n' '  ')"; } >> "$GITHUB_OUTPUT"
          code=$(curl -q --fail --silent --show-error --proto '=https' --max-time 15 --retry 2 --retry-max-time 30 \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            --header 'Content-Type: application/json' --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-raw "$payload" --output /dev/null --write-out '%{http_code}' \
            "$GITHUB_API_URL/repos/$SOURCE_REPO/statuses/$sha")
          [ "$code" = 201 ] || { echo "::error::Commit status returned HTTP $code"; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_REPO }}
          ref: ${{ steps.pr.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          # the whole history, so the change is measured from its merge base with the target branch
          fetch-depth: 0
          persist-credentials: false
      - id: node
        uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Merge main into the pull request
        env:
          BASE_SHA: '${{ steps.pr.outputs.base_sha }}'
          GIT_AUTHOR_NAME: pr-unit-tests
          GIT_AUTHOR_EMAIL: pr-unit-tests@invalid
          GIT_COMMITTER_NAME: pr-unit-tests
          GIT_COMMITTER_EMAIL: pr-unit-tests@invalid
        run: |
          set -euo pipefail
          git show "$BASE_SHA:scripts/merge-generated.mjs" > "$RUNNER_TEMP/merge-generated.mjs"
          node "$RUNNER_TEMP/merge-generated.mjs" "$BASE_SHA"
      # the related-test search needs no Electron or install script, only the modules it reads with: it restores what the
      # test jobs saved, and on a miss installs without scripts and saves nothing. Why the cache is keyed as it is: the next
      # job that restores node_modules (below)
      - id: keys
        run: node scripts/ci-install.mjs keys >> "$GITHUB_OUTPUT"
      - id: deps
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ steps.keys.outputs.root }}
      - run: node scripts/ci-install.mjs --root=${{ steps.deps.outputs.cache-hit == 'true' && 'hit' || 'miss' }} --web=skip --mobile=skip --ignore-scripts
      - id: split
        run: node scripts/test-shards.mjs plan --changed=${{ steps.pr.outputs.base_sha }}
      # the fake-based E2E specs the change can break (docs/unit-coverage.md#e2e-specs), for job `e2e-start`
      - id: e2e
        run: node scripts/e2e-select.mjs --changed=${{ steps.pr.outputs.base_sha }}

  # the static checks, one after another on one runner: Biome and the lint ratchet (which lints the whole tree too) take
  # about a minute apiece and the type checks less, so the job ends within the test shards' time for all but the smallest
  # changes, and a runner each would spend about 40 seconds more apiece on checkout and install (docs/unit-coverage.md#runners).
  # Every check runs once the install succeeded, even after another failed, so every failure shows at once. The plan
  # leaves out `types` when no changed path is one the type checks read (typesChanged in scripts/precommit.mjs): main's
  # own runs checked the rest
  static:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_REPO }}
          ref: ${{ needs.plan.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          # the whole history, so the change is measured from its merge base with the target branch
          fetch-depth: 0
          persist-credentials: false
      - id: node
        uses: actions/setup-node@v4
        with: { node-version: 24 }
      # the pre-commit hook's header check: every source file has a one-line header comment (it needs only Node)
      - run: npm run module-map -- --check
      # what merging would produce. main's scripts/merge-generated.mjs merges (the pull request may predate it) and
      # drops the generated files main no longer commits (docs/module-map.md), so a conflict only there is none, as
      # merge-on-green's result has it. Any other conflict fails the check (merge main into the branch and push)
      - name: Merge main into the pull request
        env:
          BASE_SHA: '${{ needs.plan.outputs.base_sha }}'
          GIT_AUTHOR_NAME: pr-unit-tests
          GIT_AUTHOR_EMAIL: pr-unit-tests@invalid
          GIT_COMMITTER_NAME: pr-unit-tests
          GIT_COMMITTER_EMAIL: pr-unit-tests@invalid
        run: |
          set -euo pipefail
          git show "$BASE_SHA:scripts/merge-generated.mjs" > "$RUNNER_TEMP/merge-generated.mjs"
          node "$RUNNER_TEMP/merge-generated.mjs" "$BASE_SHA"
      # node_modules between runs, restored instead of `npm ci` (docs/unit-coverage.md#install-cache). The key names the Node
      # the native modules were built for and what npm ci reads (scripts/ci-install.mjs keys); saved right after the install,
      # before any test runs, so a test cannot change what the next run restores
      - id: keys
        run: node scripts/ci-install.mjs keys >> "$GITHUB_OUTPUT"
      - id: deps
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ steps.keys.outputs.root }}
      # web/ is for its type check only
      - id: webdeps
        if: contains(fromJSON(needs.plan.outputs.static), 'types')
        uses: actions/cache/restore@v4
        with:
          path: web/node_modules
          key: web-node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ steps.keys.outputs.web }}
      # the phone app's packages are for the type check only (scripts/precommit.mjs --typecheck-mobile)
      - run: node scripts/ci-install.mjs --root=${{ steps.deps.outputs.cache-hit == 'true' && 'hit' || 'miss' }} --web=${{ steps.webdeps.outcome == 'skipped' && 'skip' || (steps.webdeps.outputs.cache-hit == 'true' && 'hit' || 'miss') }} ${{ !contains(fromJSON(needs.plan.outputs.static), 'types') && '--mobile=skip' || '' }}
        id: install
      - if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: { path: node_modules, key: '${{ steps.deps.outputs.cache-primary-key }}' }
      - if: steps.webdeps.outcome == 'success' && steps.webdeps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: { path: web/node_modules, key: '${{ steps.webdeps.outputs.cache-primary-key }}' }
      # the pre-commit hook's checks (scripts/precommit.mjs; tests/prUnitTestsWorkflow.test.ts keeps the two in step)
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx biome check --diagnostic-level=error .
      - if: ${{ !cancelled() && steps.install.outcome == 'success' && contains(fromJSON(needs.plan.outputs.static), 'types') }}
        run: npm run typecheck
      - if: ${{ !cancelled() && steps.install.outcome == 'success' && contains(fromJSON(needs.plan.outputs.static), 'types') }}
        run: npm run typecheck
        working-directory: web
      # no bug-class lint warning added, and no rule's total in lint/baseline.json raised (docs/bug-prevention/README.md);
      # a pull request branched before the ratchet existed has nothing to run
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: if [ -f scripts/lint-ratchet.mjs ]; then npm run lint:ratchet -- --base=${{ needs.plan.outputs.base_sha }}; fi
      # Same staged-content policy as pre-commit, applied to the merged tree against current main
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/file-size.mjs --base=${{ needs.plan.outputs.base_sha }}

  # the related tests that run anywhere, round-robin across the planned Linux shards
  unit:
    needs: plan
    if: needs.plan.outputs.shards != '[]'
    runs-on: ubuntu-latest
    # the largest planned shard takes up to twelve minutes (FILES_PER_SHARD in scripts/test-shards.mjs); a hung one ends
    # here instead of holding a Linux runner for the default six hours
    timeout-minutes: 20
    strategy:
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_REPO }}
          ref: ${{ needs.plan.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          # the whole history, so the change is measured from its merge base with the target branch
          fetch-depth: 0
          persist-credentials: false
      - id: node
        uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Merge main into the pull request
        env:
          BASE_SHA: '${{ needs.plan.outputs.base_sha }}'
          GIT_AUTHOR_NAME: pr-unit-tests
          GIT_AUTHOR_EMAIL: pr-unit-tests@invalid
          GIT_COMMITTER_NAME: pr-unit-tests
          GIT_COMMITTER_EMAIL: pr-unit-tests@invalid
        run: |
          set -euo pipefail
          git show "$BASE_SHA:scripts/merge-generated.mjs" > "$RUNNER_TEMP/merge-generated.mjs"
          node "$RUNNER_TEMP/merge-generated.mjs" "$BASE_SHA"
      # Electron's download, read from what main's runs saved and never saved from here: this job runs the pull request's
      # code, and main's runs and the release restore this key (docs/unit-coverage.md#cache-writes)
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # node_modules between runs, restored instead of `npm ci` (docs/unit-coverage.md#install-cache). The key names the Node
      # the native modules were built for and what npm ci reads (scripts/ci-install.mjs keys); saved right after the install,
      # before any test runs, so a test cannot change what the next run restores
      - id: keys
        run: node scripts/ci-install.mjs keys >> "$GITHUB_OUTPUT"
      - id: deps
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ steps.keys.outputs.root }}
      - id: webdeps
        if: needs.plan.outputs.web == 'true'
        uses: actions/cache/restore@v4
        with:
          path: web/node_modules
          key: web-node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ steps.keys.outputs.web }}
      - run: node scripts/ci-install.mjs --root=${{ steps.deps.outputs.cache-hit == 'true' && 'hit' || 'miss' }} --web=${{ steps.webdeps.outcome == 'skipped' && 'skip' || (steps.webdeps.outputs.cache-hit == 'true' && 'hit' || 'miss') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: { path: node_modules, key: '${{ steps.deps.outputs.cache-primary-key }}' }
      - if: steps.webdeps.outcome == 'success' && steps.webdeps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: { path: web/node_modules, key: '${{ steps.webdeps.outputs.cache-primary-key }}' }
      # this shard's part of the plan (refused when this checkout finds other tests); with one shard and no Mac, the job
      # also checks the change's coverage, as `npm run test:coverage -- --changed=<main> --related` does; otherwise it
      # packs the raw coverage for job `coverage`
      - env:
          MODE: ${{ needs.plan.outputs.split == 'true' && '--raw-out coverage/raw' || format('--changed={0}', needs.plan.outputs.base_sha) }}
        run: |
          files=$(node scripts/test-shards.mjs files --changed=${{ needs.plan.outputs.base_sha }} --plan=${{ needs.plan.outputs.digest }} --shard=${{ matrix.shard }}/${{ strategy.job-total }})
          npm run test:coverage -- $MODE $files
      # this shard's marker beside its packed coverage, which job coverage requires of every planned shard (planParts)
      - if: needs.plan.outputs.split == 'true'
        run: ': > coverage/raw/linux-${{ matrix.shard }}.part'
      # public, like the logs: the repository's own scripts' coverage, without their source text (scripts/raw-coverage.mjs).
      # Named for the tree and the plan, so a re-run that planned other tests never merges this attempt's upload
      - if: needs.plan.outputs.split == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ needs.plan.outputs.sha }}-${{ needs.plan.outputs.base_sha }}-${{ needs.plan.outputs.digest }}-${{ matrix.shard }}
          path: coverage/raw
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  # only the related tests that need a real Mac; the rest ran on Linux
  # where job mac runs: its author's sealed local runner or GitHub's (scripts/local-lane.mjs, docs/local-runner.md), decided
  # from main's code on a GitHub-hosted runner. If it fails or is skipped, job mac runs on macos-15.
  route-mac:
    needs: plan
    if: needs.plan.outputs.mac == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read, issues: read }
    outputs:
      runs_on: ${{ steps.route.outputs.runs_on }}
      runner: ${{ steps.route.outputs.runner }}
      audit: ${{ steps.route.outputs.audit }}
      owner: ${{ steps.route.outputs.owner }}
    steps:
      - uses: actions/checkout@v4
        with: { repository: '${{ vars.SOURCE_REPO }}', ref: main, token: '${{ secrets.SOURCE_TOKEN }}', persist-credentials: false, sparse-checkout: scripts }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      # the CI App reads the organization's runners (Self-hosted runners: read); no App, no local lane
      - id: runners-app
        if: vars.CI_APP_ID != '' && vars.LOCAL_LANE == 'on' && inputs.mac_pool != 'github'
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with: { app-id: '${{ vars.CI_APP_ID }}', private-key: '${{ secrets.CI_APP_PRIVATE_KEY }}', owner: '${{ github.repository_owner }}', permission-organization-self-hosted-runners: read }
      - id: route
        env:
          LOCAL_LANE: ${{ vars.LOCAL_LANE }}
          MAC_POOL: ${{ inputs.mac_pool }}
          LOCAL_RUNNER_OWNERS: ${{ vars.LOCAL_RUNNER_OWNERS }}
          LOCAL_WAIT_SECONDS: ${{ vars.LOCAL_WAIT_SECONDS }}
          LOCAL_AUDIT_EVERY: ${{ vars.LOCAL_AUDIT_EVERY }}
          AUDIT_OF: ${{ inputs.audit_of }}
          PR: ${{ inputs.pr }}
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          RUNNERS_TOKEN: ${{ steps.runners-app.outputs.token }}
        run: node scripts/local-lane.mjs route

  # A selected local runner can disappear before accepting its job. This trusted job sends one hosted successor.
  local-pool-watch:
    needs: [plan, route-mac]
    if: ${{ !cancelled() && needs.route-mac.outputs.runner != '' && inputs.audit_of == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read, actions: write }
    steps:
      - uses: actions/checkout@v4
        with: { repository: '${{ vars.SOURCE_REPO }}', ref: main, token: '${{ secrets.SOURCE_TOKEN }}', persist-credentials: false, sparse-checkout: scripts }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - id: ci-app
        if: vars.CI_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with: { app-id: '${{ vars.CI_APP_ID }}', private-key: '${{ secrets.CI_APP_PRIVATE_KEY }}', owner: '${{ github.repository_owner }}', permission-statuses: write }
      - name: Watch local acceptance and spill over to GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          STATUS_GH_TOKEN: ${{ steps.ci-app.outputs.token }}
          SOURCE_SHA: ${{ needs.plan.outputs.sha }}
          LOCAL_RUNNER: ${{ needs.route-mac.outputs.runner }}
          LOCAL_START_SECONDS: ${{ vars.LOCAL_START_SECONDS }}
          PR: ${{ inputs.pr }}
        run: node scripts/local-pool-watch.mjs

  mac:
    needs: [plan, route-mac]
    if: ${{ !cancelled() && needs.plan.outputs.mac == 'true' }}
    runs-on: ${{ fromJSON(needs.route-mac.outputs.runs_on || '"macos-15"') }}
    concurrency:
      group: ${{ contains(needs.route-mac.outputs.runs_on, 'self-hosted') && format('ci-local-{0}', github.run_id) || 'mopilot-hosted-mac-0' }}
      cancel-in-progress: false
      queue: max
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_REPO }}
          ref: ${{ needs.plan.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          # the whole history, so the change is measured from its merge base with the target branch
          fetch-depth: 0
          persist-credentials: false
      - id: node
        uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Merge main into the pull request
        env:
          BASE_SHA: '${{ needs.plan.outputs.base_sha }}'
          GIT_AUTHOR_NAME: pr-unit-tests
          GIT_AUTHOR_EMAIL: pr-unit-tests@invalid
          GIT_COMMITTER_NAME: pr-unit-tests
          GIT_COMMITTER_EMAIL: pr-unit-tests@invalid
        run: |
          set -euo pipefail
          git show "$BASE_SHA:scripts/merge-generated.mjs" > "$RUNNER_TEMP/merge-generated.mjs"
          node "$RUNNER_TEMP/merge-generated.mjs" "$BASE_SHA"
      # Electron's download, read from what main's runs saved and never saved from here: this job runs the pull request's
      # code, and main's runs and the release restore this key (docs/unit-coverage.md#cache-writes)
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # node_modules between runs, restored instead of `npm ci` (docs/unit-coverage.md#install-cache). The key names the Node
      # the native modules were built for and what npm ci reads (scripts/ci-install.mjs keys); saved right after the install,
      # before any test runs, so a test cannot change what the next run restores
      - id: keys
        run: node scripts/ci-install.mjs keys >> "$GITHUB_OUTPUT"
      - id: deps
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ steps.keys.outputs.root }}
      - id: webdeps
        if: needs.plan.outputs.web == 'true'
        uses: actions/cache/restore@v4
        with:
          path: web/node_modules
          key: web-node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ steps.keys.outputs.web }}
      - run: node scripts/ci-install.mjs --root=${{ steps.deps.outputs.cache-hit == 'true' && 'hit' || 'miss' }} --web=${{ steps.webdeps.outcome == 'skipped' && 'skip' || (steps.webdeps.outputs.cache-hit == 'true' && 'hit' || 'miss') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: { path: node_modules, key: '${{ steps.deps.outputs.cache-primary-key }}' }
      - if: steps.webdeps.outcome == 'success' && steps.webdeps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: { path: web/node_modules, key: '${{ steps.webdeps.outputs.cache-primary-key }}' }
      - run: |
          files=$(node scripts/test-shards.mjs files --changed=${{ needs.plan.outputs.base_sha }} --plan=${{ needs.plan.outputs.digest }} --mac)
          npm run test:coverage -- --raw-out coverage/raw $files
          : > coverage/raw/mac.part
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ needs.plan.outputs.sha }}-${{ needs.plan.outputs.base_sha }}-${{ needs.plan.outputs.digest }}-mac
          path: coverage/raw
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  # the Rust core (docs/architecture/rust-core.md §9): its tests under coverage on Linux and macOS, since code built for one OS
  # is measured there, and rustfmt and clippy once. No cache is saved: cargo builds the pull request's code
  # (docs/unit-coverage.md#cache-writes). The lcov goes to job `coverage` beside the shards' raw coverage
  rust:
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    concurrency:
      group: ${{ startsWith(matrix.os, 'macos') && 'mopilot-hosted-mac-1' || format('ci-independent-{0}-{1}-{2}', github.run_id, github.job, matrix.os) }}
      cancel-in-progress: false
      queue: max
    timeout-minutes: 25
    # the steps' set -euo pipefail on Windows too, where the default shell is PowerShell
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_REPO }}
          ref: ${{ needs.plan.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Merge main into the pull request
        env:
          BASE_SHA: '${{ needs.plan.outputs.base_sha }}'
          GIT_AUTHOR_NAME: pr-unit-tests
          GIT_AUTHOR_EMAIL: pr-unit-tests@invalid
          GIT_COMMITTER_NAME: pr-unit-tests
          GIT_COMMITTER_EMAIL: pr-unit-tests@invalid
        run: |
          set -euo pipefail
          git show "$BASE_SHA:scripts/merge-generated.mjs" > "$RUNNER_TEMP/merge-generated.mjs"
          node "$RUNNER_TEMP/merge-generated.mjs" "$BASE_SHA"
      # the toolchain core/rust-toolchain.toml pins, the coverage nightly scripts/rust-coverage.mjs pins, and cargo-llvm-cov
      - name: Install the Rust toolchains
        run: |
          set -euo pipefail
          (cd core && rustup toolchain install)
          nightly=$(node --input-type=module -e "import('./scripts/rust-coverage.mjs').then((m) => console.log(m.NIGHTLY))")
          rustup toolchain install "$nightly" --profile minimal --component llvm-tools-preview
          cargo install cargo-llvm-cov --locked --version 0.9.1
      - if: runner.os == 'Linux'
        run: node scripts/core-check.mjs
      - run: node scripts/rust-coverage.mjs --out coverage/raw/rust-${{ runner.os }}.lcov
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ needs.plan.outputs.sha }}-${{ needs.plan.outputs.base_sha }}-${{ needs.plan.outputs.digest }}-rust-${{ runner.os }}
          path: coverage/raw
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      # A Node a Host may run on (host/package.json) from before 24.14, which frees a threadsafe function as its environment
      # ends (docs/architecture/rust-core.md §4), so a mistake there crashes only on a Node this job's others are not.
      # Exact: a backport of the fix to 22.x would silently test nothing. The addon is the one the coverage step built. No
      # Host runs on Windows
      - if: runner.os != 'Windows'
        uses: actions/setup-node@v4
        with: { node-version: 22.23.4 }
      - name: The addon's teardown on a Node from before 24.14
        if: runner.os != 'Windows'
        env:
          MOPILOT_CORE_REQUIRED: '1'
        run: |
          set -euo pipefail
          addon=$(ls core/target/debug/libmopilot_core.so core/target/debug/libmopilot_core.dylib 2>/dev/null || true)
          MOPILOT_CORE="$addon" node --experimental-strip-types --disable-warning=ExperimentalWarning --disable-warning=MODULE_TYPELESS_PACKAGE_JSON \
            --test --test-concurrency=1 tests/coreBindingCalls.test.ts tests/coreBindingStream.test.ts

  # The fake-based E2E specs the change can break, started in their own run (pr-e2e.yml), so a newer check of this head,
  # which cancels this run, never cancels them (docs/unit-coverage.md#e2e-specs). This pull request's E2E runs on another
  # head are superseded: cancelled first, so the new head's run, queued behind them in their concurrency group, starts;
  # also when this head picked no specs, or its plan failed. A run of the same head is left alone: the new one waits for
  # it and carries what it passed. A check whose head the pull request no longer has does neither: the newer head's
  # check decides. A head that picked specs is marked pending first, so it never shows no `e2e-specs` while its run waits
# to start or was never started: the merge gate reads no status as none picked. No pull request code runs here
  e2e-start:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.sha != '' && inputs.audit_of == '' }}
    runs-on: ubuntu-latest
    # github.token cancels and starts runs of pr-e2e.yml
    permissions: { actions: write }
    steps:
      # before the dispatch, which the run's job start follows with its own pending status; on a head the pull request
      # has since left it marks a commit no merge reads. It links the E2E workflow, not this run: carrying passed specs,
      # an E2E run reads every run an e2e-specs status links as an E2E run of the head
      - name: Mark the picked specs queued on the head
        if: needs.plan.outputs.e2e_specs != ''
        env: { GH_TOKEN: '${{ secrets.SOURCE_TOKEN }}', SHA: '${{ needs.plan.outputs.sha }}', STATUS_CONTEXT: e2e-specs }
        run: |
          set -euo pipefail
          # Retry only transient HTTP errors/timeouts, never permission failures; no test rerun.
          payload=$(jq -cn --arg state pending --arg context "$STATUS_CONTEXT" --arg description 'Queued: the E2E specs this change can break; the merge waits for the Linux ones' \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/pr-e2e.yml" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')
          code=$(curl -q --fail --silent --show-error --proto '=https' --max-time 15 --retry 2 --retry-max-time 30 \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            --header 'Content-Type: application/json' --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-raw "$payload" --output /dev/null --write-out '%{http_code}' \
            "$GITHUB_API_URL/repos/$SOURCE_REPO/statuses/$SHA")
          [ "$code" = 201 ] || { echo "::error::Commit status returned HTTP $code"; exit 1; }
      # also when the mark failed: the specs still run, and their run's job start marks them pending
      - name: Start the E2E specs in their own run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          # the pull request's head now, read from the source repository
          SOURCE_GH_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          PR: ${{ inputs.pr }}
          SHA: ${{ needs.plan.outputs.sha }}
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          SPECS: ${{ needs.plan.outputs.e2e_specs }}
        run: |
          set -euo pipefail
          # a head that cannot be read is taken to be this one, as before the check read it
          if ! current=$(GH_TOKEN="$SOURCE_GH_TOKEN" gh api "repos/$SOURCE_REPO/pulls/$PR" --jq .head.sha); then
            echo "::warning::Could not read the head of pull request $PR"
            current=$SHA
          fi
          if [ "$current" != "$SHA" ]; then
            echo "Pull request $PR is at $current now, not $SHA: its newer check cancels and starts E2E runs."
            exit 0
          fi
          # pr-e2e.yml's run-name: "E2E specs for pull request <n> at <head> merged with main <sha>"
          title="E2E specs for pull request $PR at "
          # a listing that fails cancels nothing: job start of an older head's run skips it once the pull request moved
          if listed=$(gh run list -R "$GITHUB_REPOSITORY" --workflow pr-e2e.yml --limit 100 --json databaseId,displayTitle,status); then
            older=$(jq -r --arg title "$title" --arg same "$title$SHA " '.[]
              | select(.status != "completed" and (.displayTitle | startswith($title)) and ((.displayTitle | startswith($same)) | not))
              | .databaseId' <<< "$listed")
          else
            echo "::warning::Could not list the E2E runs of pull request $PR; none cancelled"
            older=
          fi
          for id in $older; do
            gh run cancel "$id" -R "$GITHUB_REPOSITORY" || echo "::warning::Could not cancel E2E run $id"
          done
          if [ -z "$SPECS" ]; then
            echo "No E2E specs picked for pull request $PR at $SHA"
            exit 0
          fi
          gh workflow run pr-e2e.yml -R "$GITHUB_REPOSITORY" -f pr="$PR" -f head="$SHA" -f base="$BASE_SHA" -f specs="$SPECS"
          echo "Started the E2E specs for pull request $PR at $SHA"

  # every testing job's coverage as one report, and the changed-line check a single job would have made
  coverage:
    needs: [plan, unit, mac, rust]
    if: ${{ !cancelled() && needs.plan.outputs.split == 'true' && contains(fromJSON('["success", "skipped"]'), needs.unit.result) && contains(fromJSON('["success", "skipped"]'), needs.mac.result) && contains(fromJSON('["success", "skipped"]'), needs.rust.result) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_REPO }}
          ref: ${{ needs.plan.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          # the whole history, so the change is measured from its merge base with the target branch
          fetch-depth: 0
          persist-credentials: false
      - id: node
        uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Merge main into the pull request
        env:
          BASE_SHA: '${{ needs.plan.outputs.base_sha }}'
          GIT_AUTHOR_NAME: pr-unit-tests
          GIT_AUTHOR_EMAIL: pr-unit-tests@invalid
          GIT_COMMITTER_NAME: pr-unit-tests
          GIT_COMMITTER_EMAIL: pr-unit-tests@invalid
        run: |
          set -euo pipefail
          git show "$BASE_SHA:scripts/merge-generated.mjs" > "$RUNNER_TEMP/merge-generated.mjs"
          node "$RUNNER_TEMP/merge-generated.mjs" "$BASE_SHA"
      # c8 and the coverage check need no Electron or install script
      # node_modules between runs, restored instead of `npm ci` (docs/unit-coverage.md#install-cache). The key names the Node
      # the native modules were built for and what npm ci reads (scripts/ci-install.mjs keys); saved right after the install,
      # before any test runs, so a test cannot change what the next run restores
      - id: keys
        run: node scripts/ci-install.mjs keys >> "$GITHUB_OUTPUT"
      - id: deps
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ steps.keys.outputs.root }}
      - run: node scripts/ci-install.mjs --root=${{ steps.deps.outputs.cache-hit == 'true' && 'hit' || 'miss' }} --web=skip --mobile=skip --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-${{ needs.plan.outputs.sha }}-${{ needs.plan.outputs.base_sha }}-${{ needs.plan.outputs.digest }}-*
          path: coverage/raw
          merge-multiple: true
      - run: node scripts/test-shards.mjs merge --changed=${{ needs.plan.outputs.base_sha }} --parts='${{ needs.plan.outputs.parts }}' coverage/raw

  # the `unit-tests` status, as soon as the jobs it counts are done: the E2E specs are not among them
  # (docs/unit-coverage.md#e2e-specs). It also waits for job e2e-start, whatever its result, so a head that picked specs
  # shows `e2e-specs` pending before `unit-tests` can let the merge gate merge it
  # a local result counts only from the runner routing chose (scripts/local-lane.mjs check, docs/local-runner.md)
  local-check:
    needs: [mac, route-mac]
    if: ${{ !cancelled() && needs.route-mac.outputs.runner != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read, actions: read }
    outputs:
      ok: ${{ steps.local.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
        with: { repository: '${{ vars.SOURCE_REPO }}', ref: main, token: '${{ secrets.SOURCE_TOKEN }}', persist-credentials: false, sparse-checkout: scripts }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - id: local
        env: { RUNNER: '${{ needs.route-mac.outputs.runner }}', GITHUB_TOKEN: '${{ github.token }}' }
        run: node scripts/local-lane.mjs check

  report:
    needs: [plan, static, unit, mac, rust, coverage, route-mac, local-check, e2e-start]
    # an audit (docs/local-runner.md) posts no status: job audit compares it with the local run
    if: ${{ !cancelled() && needs.plan.outputs.sha != '' && inputs.audit_of == '' }}
    runs-on: ubuntu-latest
    steps:
      # the CI App's token: a result counts only when the App posts it (docs/unit-coverage.md#who-posts-a-result). Until
      # variable CI_APP_ID is set the step is skipped, and if it fails the post still runs: either way with SOURCE_TOKEN,
      # whose result counts only while the owner's login is trusted.
      - id: ci-app
        if: vars.CI_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with: { app-id: '${{ vars.CI_APP_ID }}', private-key: '${{ secrets.CI_APP_PRIVATE_KEY }}', owner: '${{ github.repository_owner }}', permission-statuses: write }
      - name: Post the result on the pull request's head commit
        env:
          GH_TOKEN: ${{ steps.ci-app.outputs.token || secrets.SOURCE_TOKEN }}
          # the runner routing chose for job mac ('' for GitHub's), and job local-check's answer that it ran there: a local
          # result counts only on an explicit yes, so a check that failed or never ran fails it
          LOCAL_RUNNER: ${{ needs.route-mac.outputs.runner }}
          LOCAL_OK: ${{ needs.local-check.outputs.ok }}
          SHA: ${{ needs.plan.outputs.sha }}
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          RESULT: ${{ needs.static.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          SHARDS: ${{ needs.plan.outputs.shards }}
          UNIT_RESULT: ${{ needs.unit.result }}
          MAC: ${{ needs.plan.outputs.mac }}
          MAC_RESULT: ${{ needs.mac.result }}
          RUST: ${{ needs.plan.outputs.rust }}
          RUST_RESULT: ${{ needs.rust.result }}
          SPLIT: ${{ needs.plan.outputs.split }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          set -euo pipefail
          # which part failed, for the sweep's decision records (scripts/sweep-records.mjs): the static checks (whose job
          # also merges main), or the tests and coverage
          STATIC_RESULT=$RESULT
          # every job the plan needed counts; one it skipped ran nothing that was needed
          need() { if [ "$1" = true ] && [ "$2" != success ]; then RESULT=$2; fi; }
          need true "$PLAN_RESULT"
          need "$([ "$SHARDS" = '[]' ] && echo false || echo true)" "$UNIT_RESULT"
          need "$MAC" "$MAC_RESULT"
          need "$RUST" "$RUST_RESULT"
          need "$SPLIT" "$COVERAGE_RESULT"
          if [ -n "${LOCAL_RUNNER:-}" ] && [ "${LOCAL_OK:-}" != true ]; then RESULT=failure; fi
          # scripts/merge-gate.mjs reads the main commit back from "merged with main <sha>"; at most 140 characters
          if [ "$RESULT" = success ]; then state=success; description="Passed merged with main $BASE_SHA: static checks, ratchet, related unit tests, coverage"
          elif [ "$PLAN_RESULT" != success ]; then state=failure; description="Failed merged with main $BASE_SHA: merge, static checks, ratchet, unit tests or coverage"
          elif [ "$STATIC_RESULT" != success ]; then state=failure; description="Failed merged with main $BASE_SHA: merge, static checks or ratchet"
          else state=failure; description="Failed merged with main $BASE_SHA: unit tests or coverage"; fi
          # Retry only transient HTTP errors/timeouts, never permission failures; no test rerun.
          payload=$(jq -cn --arg state "$state" --arg context "$STATUS_CONTEXT" --arg description "$description" \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')
          owner=$(gh api "repos/$SOURCE_REPO/commits/$SHA/statuses?per_page=100" --jq '[.[] | select(.context == "unit-tests")][0].target_url // ""')
          [ "$owner" = "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" ] || { echo "Result retired: a newer check owns this head."; exit 0; }
          code=$(curl -q --fail --silent --show-error --proto '=https' --max-time 15 --retry 2 --retry-max-time 30 \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            --header 'Content-Type: application/json' --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-raw "$payload" --output /dev/null --write-out '%{http_code}' \
            "$GITHUB_API_URL/repos/$SOURCE_REPO/statuses/$SHA")
          [ "$code" = 201 ] || { echo "::error::Commit status returned HTTP $code"; exit 1; }
          echo "Pull request ${{ inputs.pr }} at $SHA: $state"

  runner-status:
    needs: [plan, report]
    if: ${{ !cancelled() && needs.plan.outputs.sha != '' }}
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read }
    steps:
      # Main's reporting code only: this job holds a token, so no PR code runs here.
      - uses: actions/checkout@v4
        with: { repository: '${{ vars.SOURCE_REPO }}', ref: main, token: '${{ secrets.SOURCE_TOKEN }}', persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Summarize runner wait and execution
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.plan.outputs.sha }}
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          TEST_PLAN: ${{ needs.plan.outputs.digest }}
          CHECK_REASON: ${{ needs.plan.outputs.reason }}
        run: node scripts/ci-status.mjs

  # one sampled local run in LOCAL_AUDIT_EVERY is run again on GitHub's runners for the same head and main; the audit's
  # own job here compares the two macOS results and quarantines the runner's owner on a local pass that failed on GitHub
  audit:
    needs: [plan, mac, route-mac, local-check, report]
    if: ${{ !cancelled() && needs.plan.outputs.sha != '' && (inputs.audit_of != '' || (needs.route-mac.outputs.audit == 'true' && needs.local-check.outputs.ok == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read, actions: write, issues: write }
    steps:
      - uses: actions/checkout@v4
        with: { repository: '${{ vars.SOURCE_REPO }}', ref: main, token: '${{ secrets.SOURCE_TOKEN }}', persist-credentials: false, sparse-checkout: scripts }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Audit this local run on GitHub's runners
        if: inputs.audit_of == ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          SHA: ${{ needs.plan.outputs.sha }}
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          MAC_RESULT: ${{ needs.mac.result }}
          OWNER: ${{ needs.route-mac.outputs.owner }}
        run: |
          gh workflow run pr-unit-tests.yml -R "$GITHUB_REPOSITORY" -f pr="$PR" -f audit_of="$GITHUB_RUN_ID" \
            -f audit_head="$SHA" -f audit_base="$BASE_SHA" -f audit_result="$MAC_RESULT" -f audit_owner="$OWNER"
      - name: Compare with the local run
        if: inputs.audit_of != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUDIT_OF: ${{ inputs.audit_of }}
          LOCAL_RESULT: ${{ inputs.audit_result }}
          HOSTED_RESULT: ${{ needs.mac.result }}
          OWNER: ${{ inputs.audit_owner }}
          PR: ${{ inputs.pr }}
        run: node scripts/local-lane.mjs audit
