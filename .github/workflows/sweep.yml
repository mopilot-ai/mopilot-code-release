name: Sweep
# Runs in the public release repository (mopilot-ai/mopilot-code-release), like pr-unit-tests.yml beside it;
# scripts/sync-release-repo.sh copies this file there as .github/workflows/sweep.yml.
# Whenever a pull request check or a run on main finishes, it runs scripts/ci-sweep.mjs from a checkout of main: it
# starts the unit-tests check for open pull requests whose head has none, merges pull requests labeled
# `merge-on-green` that the merge gate allows, and starts main-unit-tests (at most every ten minutes) and main-e2e (at
# most every 30 minutes) on an untested main. GitHub's schedule events are best effort and were rarely fired here, so finishing
# runs drive it; the schedule below is only a backup, and starting it by hand runs one sweep.
#
# Then it copies main's workflows here (scripts/sync-release-repo.sh, which writes only the files that differ): a
# workflow merged on main does nothing here until copied, and a release refuses a release.yml other than the one it
# builds. 0.3.33 failed that way after merge-on-green merged a release.yml change nobody then copied.
#
# Secret SOURCE_TOKEN: the token the other workflows use (Contents read and write, Commit statuses read and write,
# Pull requests read, Issues read and write). github.token starts the other workflows here.
# Secret WORKFLOW_SYNC_TOKEN: a fine-grained token with Contents and Workflows read and write on this repository only,
# for the copy (github.token cannot change workflows). Without it the sweep warns instead of copying.
run-name: ${{ github.event_name == 'workflow_run' && format('Sweep after {0}', github.event.workflow_run.name) || 'Sweep' }}
on:
  workflow_run:
    workflows: ['PR unit tests', 'Main unit tests', 'Main E2E']
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
permissions: { contents: read, actions: write }
concurrency:
  # one sweep at a time; finishing runs that pile up while it works share the one waiting after it
  group: sweep
  cancel-in-progress: false
env:
  SOURCE_REPO: ${{ vars.SOURCE_REPO }}

jobs:
  sweep:
    if: vars.SOURCE_REPO != ''
    runs-on: ubuntu-latest
    env:
      HAS_SYNC_TOKEN: ${{ secrets.WORKFLOW_SYNC_TOKEN != '' }}
    steps:
      # main's code, never a pull request's, with the token the merge gate's fetch needs
      - uses: actions/checkout@v4
        with: { repository: '${{ vars.SOURCE_REPO }}', ref: main, token: '${{ secrets.SOURCE_TOKEN }}', fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Start missing checks, merge on green, start the runs on main when due
        env: { GH_TOKEN: '${{ secrets.SOURCE_TOKEN }}', RELEASE_GH_TOKEN: '${{ github.token }}', RELEASE_REPO: '${{ github.repository }}' }
        # its output also goes to the log the issue below quotes
        run: |
          set -o pipefail
          node scripts/ci-sweep.mjs 2>&1 | tee -a "$RUNNER_TEMP/sweep.log"
      # after the merges above, and even when a step of the sweep failed; main as it is now, fetched again by the script
      - name: Copy main's workflows here
        if: ${{ !cancelled() && env.HAS_SYNC_TOKEN == 'true' }}
        env: { GH_TOKEN: '${{ secrets.WORKFLOW_SYNC_TOKEN }}', RELEASE_REPO: '${{ github.repository }}' }
        run: |
          set -o pipefail
          bash scripts/sync-release-repo.sh origin/main 2>&1 | tee -a "$RUNNER_TEMP/sweep.log"
      - if: ${{ !cancelled() && env.HAS_SYNC_TOKEN != 'true' }}
        run: echo "::warning::Set the secret WORKFLOW_SYNC_TOKEN so the sweep copies main's workflows here; until then run scripts/sync-release-repo.sh after merging a workflow change."
      # A sweep posts no commit status, so a failing one is reported here: two failed sweeps in a row open the main-red
      # issue "Main is red: sweep", and the next sweep that passes closes it (scripts/sweep-red-issue.mjs). A sweep that
      # crashed on a missing package stopped every check and merge for 7.5 hours while main read green. Like the sweep,
      # it runs with no installed packages (tests/ciDependencies.test.ts). Needs SOURCE_TOKEN to have Issues read and write.
      - name: Open, update or close the sweep's main-red issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          RELEASE_GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          STATE: ${{ job.status }}
        run: node scripts/sweep-red-issue.mjs "$STATE" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$RUNNER_TEMP/sweep.log"
